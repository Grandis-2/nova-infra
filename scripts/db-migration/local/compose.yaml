# 이전 계획의 관문 G3 를 로컬에서 시험하는 환경.
#   ncp        NCP 역할 MySQL 8.4.11 (GTID · binlog ROW, NCP 권한 단계를 흉내 낸 계정)
#   rds        RDS 역할 MySQL 8.4.11 (RDS 마스터 권한을 흉내 낸 계정, 복제 필터)
#   proxysql1/2 ProxySQL 3.0.11 두 대 (운영의 2대 + NLB 를 대신한다)
#   tools      db-migration 스크립트를 돌리는 곳 (mysql · mysqldump · mysqlsh)
#   probe      앱과 같은 Java 25 · HikariCP · Connector/J 로 쓰고 읽는 시험 클라이언트
# up.sh 가 비밀번호(work/local.env)와 ProxySQL 설정(work/proxysql.cnf)을 만든 뒤 띄운다. work/ 는 git 에 올리지 않는다.
name: dbmig

x-mysql: &mysql
  image: mysql:8.4.11
  env_file: work/local.env
  healthcheck:
    test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
    interval: 2s
    timeout: 3s
    retries: 90

services:
  ncp:
    <<: *mysql
    command:
      - --server-id=1
      - --binlog-expire-logs-seconds=604800
    volumes:
      - ./mysql/init-ncp.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./mysql/g1.cnf:/etc/mysql/conf.d/g1.cnf:ro
    # 리허설 시험(50-rehearsal-proxysql.sh)에서 같은 서버를 리허설 주소로 부른다
    networks:
      default:
        aliases: [ncp-rehearsal]

  rds:
    <<: *mysql
    command:
      - --server-id=2
      - --require-secure-transport=ON
      - --local-infile=ON
      - --replicate-wild-do-table=shop.%
      - --replicate-wild-do-table=external_mock.%
    volumes:
      - ./mysql/init-rds.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./mysql/g1.cnf:/etc/mysql/conf.d/g1.cnf:ro
    networks:
      default:
        aliases: [rds-rehearsal]

  proxysql1: &proxysql
    image: proxysql/proxysql:3.0.11
    volumes:
      - ./work/proxysql.cnf:/etc/proxysql.cnf:ro
    depends_on:
      ncp: { condition: service_healthy }
      rds: { condition: service_healthy }

  proxysql2: *proxysql

  tools:
    image: mysql:8.4.11
    entrypoint: ["sleep", "infinity"]
    env_file: work/local.env
    volumes:
      - ..:/scripts:ro
      - ./work:/work

  probe:
    image: eclipse-temurin:25-jdk
    entrypoint: ["sleep", "infinity"]
    working_dir: /probe
    env_file: work/local.env
    volumes:
      - ./probe:/probe:ro
      - ./work:/work

  # apps.sh 가 실제 be 서비스를 붙일 때만 띄운다(--profile apps)
  redis:
    image: redis:8
    profiles: [apps]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  floci:
    image: floci/floci:2.1.0
    profiles: [apps]

  floci-init:
    image: amazon/aws-cli:2.37.4
    profiles: [apps]
    depends_on: [floci]
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: ap-northeast-2
    entrypoint: ["sh", "/init/create-queues.sh"]
    volumes:
      - ./work/be/docker/floci/create-queues.sh:/init/create-queues.sh:ro
