# Atlantis 프로젝트 정의. 스택 하나가 프로젝트 하나다.
# PR 에서 바뀐 파일이 속한 스택만 plan 한다. 공용 파일(terraform/variables, provider · version,
# _modules, terraform/application/*/*.yml)이 바뀌면 그 파일을 쓰는 스택도 함께 plan 한다.
#
# 폴더 구조
#   <서비스>/grandis-nova                     계정 단위 (init, iam, s3, edge, cdn)
#   <서비스>/grandis-nova/ap-northeast-2      리전 단위 (kms, ecr, sqs, acm, secretsmanager)
#   <서비스>/nova_apnortheast2                VPC 단위 (vpc, securitygroup, elasticache, ecs, bastion, scheduler, monitoring)
#
# 적용 순서: execution_order_group 이 낮은 층부터 적용한다.
#   0 init, sops      최초 적용은 관리자가 직접 한다
#   1 vpc             최초 적용은 관리자가 직접 한다
#   2 securitygroup, s3, sqs, ecr, acm, secretsmanager
#   3 ncp-database, elasticache, cdn
#   4 iam
#   5 ecs, bastion
#   6 edge, scheduler, monitoring
#
# 한 PR 이 여러 층을 바꾸면 위층 plan 은 아래층 apply 전의 값으로 만들어진다.
# 아래층을 apply 한 뒤 `atlantis plan -p <위층>` 으로 다시 plan 하고 apply 한다.
#
# 공통 값은 terraform/variables/global.auto.tfvars 에서 읽는다. Atlantis 서버는
# 실행 역할(TF_VAR_assume_role_arn), backend 설정(TF_CLI_ARGS_init), NCP 인증키만 넣는다.
# 스택은 PR 하나에 층 하나씩 올린다. 아직 레포에 올리지 않은 스택은 autoplan 을 꺼 둔다 —
# 켜 두면 공용 파일이 바뀐 PR 에서 Atlantis 가 없는 폴더까지 plan 하려다 실패한다. 그 스택을 올리는 PR 에서 true 로 바꾼다.
version: 3
automerge: true # atlantis apply 가 모든 프로젝트에서 성공하면 PR 을 자동으로 병합한다
parallel_plan: false # Atlantis 태스크 메모리가 작아 plan 을 하나씩 돌린다
parallel_apply: false
abort_on_execution_order_fail: true # 아래층 apply 가 실패하면 위층은 적용하지 않는다

projects:

  # 상태 저장 버킷. 최초 생성은 관리자가 직접 했다 (terraform/aws/init/grandis-nova/backend.tf 주석)
  - name: init
    dir: terraform/aws/init/grandis-nova
    execution_order_group: 0
    workspace: default
    terraform_version: v1.16.0
    autoplan:
      when_modified: ["*.tf", "*.tfvars", ".terraform.lock.hcl", "../../../variables/*.tf", "../../../variables/*.tfvars", "../../*.tf"]
      enabled: false
    apply_requirements: [mergeable] # TODO: 팀원이 승인할 수 있게 되면 [approved, mergeable] 로 되돌린다

  # sops 용 KMS 키와 역할. Atlantis 비밀도 이 키로 암호화한다
  - name: sops
    dir: terraform/aws/kms/grandis-nova/ap-northeast-2
    execution_order_group: 0
    workspace: default
    terraform_version: v1.16.0
    autoplan:
      when_modified: ["*.tf", "*.tfvars", ".terraform.lock.hcl", "../../../../variables/*.tf", "../../../../variables/*.tfvars", "../../../*.tf", "../../_modules/sops/*.tf"]
      enabled: true
    apply_requirements: [mergeable] # TODO: 팀원이 승인할 수 있게 되면 [approved, mergeable] 로 되돌린다

  # VPC, 서브넷, NAT 인스턴스(고정 IP), S3 엔드포인트
  - name: vpc
    dir: terraform/aws/vpc/nova_apnortheast2
    execution_order_group: 1
    workspace: default
    terraform_version: v1.16.0
    autoplan:
      when_modified: ["*.tf", "*.tfvars", ".terraform.lock.hcl", "../../../variables/*.tf", "../../../variables/*.tfvars", "../../*.tf", "../_modules/flow_log/*.tf"]
      enabled: true
    apply_requirements: [mergeable] # TODO: 팀원이 승인할 수 있게 되면 [approved, mergeable] 로 되돌린다

  # 보안 그룹
  - name: securitygroup
    dir: terraform/aws/securitygroup/nova_apnortheast2
    execution_order_group: 2
    workspace: default
    terraform_version: v1.16.0
    autoplan:
      when_modified: ["*.tf", "*.tfvars", ".terraform.lock.hcl", "../../../variables/*.tf", "../../../variables/*.tfvars", "../../*.tf", "../../../application/*/*.yml", "../_modules/service/*.tf"]
      enabled: true # 이 스택을 올리는 PR 에서 true
