# be API ↔ ALB 경로 · WAF 본문 상한 대조 (scripts/route-check/route_check.py)
# be 는 새 API 를 인프라에 알리지 않으므로 매일 be main 을 받아 직접 대 본다.
# 정해진 시각 · 수동 실행에서 문제가 있으면 이슈를 열거나 고치고, 없어지면 닫는다. 경로 규칙을 바꾸는 PR 에서는 결과만 보여 준다.
name: route-check

on:
  schedule:
    - cron: "0 0 * * *" # 매일 09:00 KST
  workflow_dispatch:
  pull_request:
    paths:
      - "terraform/application/*/service.yml"
      - "scripts/route-check/**"
      - ".github/workflows/route-check.yml"

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Grandis-2/be
          ref: main
          path: be

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml==6.0.2

      - id: check
        continue-on-error: true
        run: python scripts/route-check/route_check.py --be be --report report.md

      # 검사기가 깨져도 보고서가 남는다(종료 코드 2). 그래도 없으면 요약 · 이슈 단계가 멈추지 않게 둔다
      - run: cat report.md >> "$GITHUB_STEP_SUMMARY" || echo "보고서가 없다" >> "$GITHUB_STEP_SUMMARY"

      - name: 이슈로 알림
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          title="be API 경로 점검"
          number=$(gh issue list --state open --search "in:title \"$title\"" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ "$OUTCOME" = failure ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$title" --body-file report.md --assignee UHeeJoon
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "다시 대조한 결과 문제가 없어 닫는다."
          fi

      - if: steps.check.outcome == 'failure'
        run: exit 1
