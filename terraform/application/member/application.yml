# member — 인증 · 회원 · JWKS 게시
# 인프라가 채우는 값(이름, 포트, DB · Redis 주소, SQS 리전)과 비밀은 적지 않는다.
# 비밀: JWT_PRIVATEKEY · ADMIN_PASSWORDHASH (service.yml generated_secrets), KAKAO_CLIENTSECRET (secrets.sops.yml)
spring:
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED # 빠뜨려도 기동은 되지만 부하가 몰리면 교착이 난다
      maximum-pool-size: 10 # DB 최대 연결 수가 (DB 쓰는 태스크 수 × 10) 이상이어야 한다
      # 드라이버가 상태가 같을 때 보내는 명령을 줄여 DB 왕복을 아낀다
      data-source-properties:
        useLocalSessionState: true # autocommit · 읽기 전용 · 격리 수준이 이미 같으면 SET 을 보내지 않는다
        useLocalTransactionState: true # 아무 문장도 안 보냈으면 commit · rollback 을 보내지 않는다
        cacheServerConfiguration: true # 새 연결마다 서버 변수를 다시 묻지 않는다
  jpa:
    hibernate:
      ddl-auto: validate # 스키마는 Flyway 가 만든다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      timeout: 300ms
      connect-timeout: 200ms
      lettuce:
        pool:
          max-active: 16
          max-wait: 100ms

server:
  # none 으로 고정한다. 비워 두면 Boot 가 ECS 를 감지해 X-Forwarded-For 를 고쳐 쓰고,
  # 관리자 로그인 시도 제한이 IP 를 잘못 판정한다
  forward-headers-strategy: none

kakao:
  client-id: ecc34a298970504bc09587bc99844484 # REST API 키. 브라우저 인가 URL 에도 실리는 공개 값이다
  client-secret: ${KAKAO_CLIENTSECRET}
  token-uri: https://kauth.kakao.com/oauth/token
  user-info-uri: https://kapi.kakao.com/v2/user/me
  # 프런트가 보낸 redirectUri 가 이 목록과 정확히 같아야 한다. 프런트의 <origin>/auth/kakao/callback 이고,
  # 카카오 콘솔의 Redirect URI 에도 같은 값이 있어야 한다
  allowed-redirect-uris:
    - https://grandis-nova.link/auth/kakao/callback
    - https://www.grandis-nova.link/auth/kakao/callback
    - http://localhost:5173/auth/kakao/callback   # 로컬 개발 (plan 에 localhost 경고가 남는다)
  connect-timeout: 2s
  read-timeout: 5s

admin:
  username: admin
  password-hash: ${ADMIN_PASSWORDHASH}

member:
  refresh-cleanup:
    cron: "0 */10 * * * *"
    batch-size: 1000
    max-batches-per-run: 100

auth:
  admin-login-limit:
    max-attempts: 5
    max-total-attempts: 60
    window: 1m
    trusted-proxy-hops: 2 # CloudFront → ALB. X-Forwarded-For 오른쪽에서 두 번째가 사용자 IP
  cookie:
    secure: true
  refresh:
    allowed-origins:
      # 재발급 요청의 Origin. 프런트 도메인과 정확히 같아야 한다
      - https://grandis-nova.link
      - https://www.grandis-nova.link
  revocation-check:
    fail-closed-paths:
      - /api/v1/admin/**
      - /api/v1/session/refresh
      - /api/v1/me/**

jwt:
  issuer: nova
  audience: nova-api
  key-id: 2026-09-k1 # 키를 바꿀 때마다 새 이름
  private-key: ${JWT_PRIVATEKEY}
  access-token-validity: 30m
  refresh-token-validity: 14d

nova:
  sqs:
    api-call-timeout: 3s
    # 알림 저장(contracts/notification-events.md). 큐는 이름으로 찾는다(리전은 인프라가 채운다)
    consumer:
      enabled: true
      queue: notification
      concurrency: 2         # 밀리면 member.notifications.lag 가 는다. DB 풀 10 안에서 늘린다
      wait-seconds: 20
      # 한 묶음은 차례로 처리한다. DB 가 끊기면 건마다 연결 대기(Hikari 기본 30s)가 걸려 5건이면 150s — 가시성이 그보다 짧으면
      # 처리 중인 메시지가 다시 보여 다른 작업이 받고, 받은 횟수가 헛되이 올라 일시 오류인데도 DLQ 로 간다
      max-messages: 5
      visibility: 3m
      # 일시 오류(DB 순단)는 5번 다시 받다가 DLQ 로 간다. 30s 면 그때까지 6~12분이라 짧은 순단에 DLQ 가 차지 않는다(5s 면 1~3분)
      backoff-base: 30s
      backoff-max: 5m
