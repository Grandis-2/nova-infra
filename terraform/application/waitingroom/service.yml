# 대기열 입장 판정 + POST /api/v1/preorders 중계 (Spring Cloud Gateway)
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상 또는 버전 태그(0.0.N-rM)
cpu: 2048                      # 1대가 첫 몰림을 받는다. JIT 예열(CPU 의 절반)을 한 번만 치르게 1대를 키웠다(부하 시험 10-22)
memory: 4096                   # Fargate 는 vCPU 2 에 최소 4 GiB
port: 8085
management_port: 9085          # 앱 기본값(WaitingroomDefaults)과 맞춘다
deployment: blue_green

scaling:
  desired: 3
  # 회차가 예상 방문자 없이 열리면 이 대수로 몰림을 받는다(be nova.scaling 의 기본 대수). 1대는 10초에 5,000명 진입에
  # CPU 가 포화돼 첫 50초 p99 가 10초를 넘었고 Redis 응답도 시간 초과가 났다(부하 시험 10-26 rush)
  min: 3
  max: 10                     # 대기열 트래픽을 직접 받는다. 예상 방문자 ÷ visitors-per-task(preorder application.yml)만큼 미리 는다
  requests_per_task: 3500     # 1대가 1분에 받는 요청이 넘으면 바로 늘린다(부하 시험 10-21: 1대 분당 6,000건에 CPU 100%)

health:
  port: 9085
  path: /actuator/health/readiness
  matcher: "200"

routes:
  - priority: 10
    paths: ["/api/v1/preorders/queue*", "/api/v1/admin/waitingroom*"]
  # 접수(POST)만 대기열을 거친다. 조회(GET)는 같은 경로라도 preorder(30)가 받는다
  - priority: 11
    paths: ["/api/v1/preorders"]
    methods: [POST]

jwt: verify
calls:
  waitingroom.relay.preorder-uri: preorder
redis: main                     # 전용 Redis 가 필요하면 elasticache clusters 에 추가하고 이 값을 바꾼다

queues:
  send: [preorder-events]
  consume: [waitingroom-events]

# preorder 와 같은 값을 쓴다 (공유 시크릿 nova-prod/shared/waiting-token)
generated_secrets:
  WAITING_TOKEN_SECRET: shared/waiting-token

profiling: true                 # 프로파일(Pyroscope)을 보낸다. preorder 에서 부담을 잰 뒤 넓혔다(CPU +0.2%p, 메모리 약 60 MiB)
