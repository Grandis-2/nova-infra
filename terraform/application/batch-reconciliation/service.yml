# 정합성 검사. 관리자 실행 요청을 5초마다 가져가야 해서 상시로 띄운다. 항상 1개만 띄운다
deploy: false                   # be 가 nova/<이 폴더 이름> 에 이미지를 올린 뒤 true 로 바꾼다(2단계)
cpu: 512
memory: 1024
port: 0
deployment: singleton           # 옛 태스크를 먼저 내려 같은 작업이 두 번 돌지 않게 한다
spot: false                     # Spot 회수로 태스크가 내려가면 도는 중이던 정합성 검사가 실패로 끝나고 그날은 다시 돌지 않는다

db: shop
db_account: batch               # 합치기 전 batch 계정을 같이 쓴다(nova-prod/db/app/batch). 앱별 계정을 만들면 지운다
calls:
  external.mock.base-url: mock  # 정합성 검사가 Mock 원장을 목록 조회 API 로 읽는다. external_mock DB 는 읽지 않는다
