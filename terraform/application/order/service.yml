# 주문 · 재고 · 결제 시도
deploy: true
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상
cpu: 1024
memory: 2048
port: 8084
management_port: 9084           # 앱 기본값(OrderDefaults)과 같다. 서비스 포트와 같게 두면 기동하지 않는다
deployment: blue_green

scaling:
  desired: 1
  min: 1
  max: 4

health:
  port: 9084
  path: /actuator/health/readiness
  matcher: "200"

routes:
  # 규칙 하나에 경로 · 메서드를 합쳐 4개까지 넣는다(규칙 조건 값 5개 중 하나는 원본 확인 헤더). route 를 늘리면 ECS 서비스를 다시 만드니(lb_shape) 빈자리에 넣는다
  # 재고는 order 가 관리한다. catalog(50)의 /api/v1/admin/products* 보다 먼저 매칭한다. 끝을 열어 재고 아래 경로(대조 등)도 받는다. 드로우(회차 · 응모)도 order 다
  - priority: 20
    paths: ["/api/v1/admin/products/*/stock*", "/api/v1/admin/stock*", "/api/v1/draws*", "/api/v1/admin/draws*"]
  - priority: 40
    paths: ["/api/v1/orders*", "/api/v1/admin/orders*", "/api/v1/cart*"]

jwt: verify
calls:
  spring.http.serviceclient.preorder.base-url: preorder
  spring.http.serviceclient.catalog.base-url: catalog   # 장바구니 · 드로우의 상품 정보
  spring.http.serviceclient.payment.base-url: payment
  spring.http.serviceclient.payment-confirm.base-url: payment
db: shop
redis: main                     # 토큰 폐기 여부 확인

queues:
  send: [payment-events, preorder-events, order-events, draw-register, notification]   # order-events 는 지연 재처리(defer)할 때 자기 큐에 다시 넣는다. draw-register 는 드로우 응모 · 추첨 요청
  consume: [order-events]

profiling: true                 # 프로파일(Pyroscope)을 보낸다. preorder 에서 부담을 잰 뒤 넓혔다(CPU +0.2%p, 메모리 약 60 MiB)
