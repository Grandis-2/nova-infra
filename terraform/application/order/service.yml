# 주문 · 재고 · 결제 시도
deploy: true
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상
cpu: 1024
memory: 2048
port: 8084
management_port: 9084           # 앱 기본값(OrderDefaults)과 같다. 서비스 포트와 같게 두면 기동하지 않는다
deployment: blue_green

scaling:
  desired: 1
  min: 1
  max: 4

health:
  port: 9084
  path: /actuator/health/readiness
  matcher: "200"

routes:
  # 규칙 하나의 경로는 3개까지다(ALB 조건당 비교 문자열 한도). route 를 늘리면 ECS 서비스를 다시 만드니(lb_shape) 빈자리에 넣는다
  # 재고는 order 가 관리한다. catalog(50)의 /api/v1/admin/products* 보다 먼저 매칭한다. 드로우(회차 · 응모)도 order 다
  - priority: 20
    paths: ["/api/v1/admin/products/*/stock", "/api/v1/draws*", "/api/v1/admin/draws*"]
  - priority: 40
    paths: ["/api/v1/orders*", "/api/v1/admin/orders*", "/api/v1/cart*"]

jwt: verify
calls:
  spring.http.serviceclient.preorder.base-url: preorder
  spring.http.serviceclient.payment.base-url: payment
  spring.http.serviceclient.payment-confirm.base-url: payment
db: shop
redis: main                     # 토큰 폐기 여부 확인

queues:
  send: [payment-events, preorder-events, order-events]   # order-events 는 지연 재처리(defer)할 때 자기 큐에 다시 넣는다
  consume: [order-events]
