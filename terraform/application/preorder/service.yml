# 접수 · 순번 · 회차 · 배송 차수 (Core)
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상 또는 버전 태그(0.0.N-rM)
cpu: 1024
memory: 2048
port: 8083
management_port: 9083
deployment: blue_green

scaling:
  desired: 1
  min: 1
  max: 5                      # 접수가 몰리면 가장 먼저 늘어난다
  requests_per_task: 1500     # 1대가 1분에 받는 요청이 넘으면 바로 늘린다(부하 시험 10-21: 1대 분당 약 2,100건에 CPU 84%)
                              # ALB 로 직접 오는 조회 · 폴링만 센다. 접수(POST)는 waitingroom 이 Service Connect 로 넘겨 여기 없고 CPU 경보가 맡는다

health:
  port: 9083
  path: /actuator/health/readiness
  matcher: "200"

routes:
  # preorder 의 외부 경로는 모두 이 두 접두어 아래다(배송 차수 · 회차 · 동기화 작업 · DLQ 포함)
  # POST /api/v1/preorders 와 /api/v1/preorders/queue* 는 waitingroom(10, 11)이 먼저 받는다
  - priority: 30
    paths: ["/api/v1/preorders*", "/api/v1/admin/preorders*"]

jwt: verify
calls:
  spring.http.serviceclient.catalog.base-url: catalog
  spring.http.serviceclient.order.base-url: order
  external.mock.base-url: mock  # 정합성 관리자 화면의 키로 Mock 취소 · 조회. 없으면 preorder 가 기동하지 않는다
db: shop
redis: main

queues:
  send: [preorder-register, preorder-cancel, order-events, waitingroom-events, notification]
  consume: [preorder-events]
  dlq: [preorder-events, preorder-register, preorder-cancel]   # preorder-events 는 DLQ 메시지를 DB 로 옮기고, 작업 DLQ 는 해당 작업을 DEAD_LETTER 로 바꾼다

# waitingroom 과 같은 값을 쓴다 (공유 시크릿 nova-prod/shared/waiting-token)
generated_secrets:
  WAITING_TOKEN_SECRET: shared/waiting-token

profiling: true                 # 프로파일(Pyroscope)을 보낸다. 켜기 전과 비교한 부담: CPU +0.2%p, 메모리 약 60 MiB
