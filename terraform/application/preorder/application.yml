spring:
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED   # 빠뜨려도 기동은 되지만 부하가 몰리면 교착이 난다
      maximum-pool-size: 10                               # DB 최대 연결 수가 (DB 쓰는 태스크 수 × 10) 이상이어야 한다
  jpa:
    hibernate:
      ddl-auto: validate                                  # 스키마는 Flyway 가 만든다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      timeout: 300ms
      connect-timeout: 200ms
      lettuce:
        pool:
          max-active: 16
          max-wait: 100ms

  threads:
    virtual:
      enabled: true
  http:
    serviceclient:
      catalog:
        connect-timeout: 300ms
        read-timeout: 1s
      order:
        connect-timeout: 300ms
        read-timeout: 1s
jwt:
  issuer: nova
  audience: nova-api
  access-token-validity: 30m
  refresh-token-validity: 14d
nova:
  outbox:
    transport: sqs
    # 커밋 직후 발행 스레드 수(= 발행이 쥐는 커넥션 상한)는 코드 기본값 2 — 덮지 않는다. 32 면 풀(10)을 접수와 다툰다
    relay-interval: 10s
    relay-after: 1m
    relay-batch: 100
    relay-lease: 1m
  sqs:
    api-call-timeout: 3s
    consumer:
      enabled: true
      queue: preorder-events
      concurrency: 1
      wait-seconds: 20
      visibility: 5m
      backoff-base: 30s    # 실패는 대개 DB 장애다. DLQ 로 넘어가기 전 재수신 5회가 장애 조치보다 길게(약 6~12분)
      backoff-max: 5m
    dead-letter:
      enabled: true
      queue: preorder-events-dlq
  admission-ticket:
    secret: ${WAITING_TOKEN_SECRET}
    previous: ${WAITING_TOKEN_PREVIOUS:}
    rollout-ends-at: ${WAITING_TOKEN_ROLLOUT_ENDS_AT:}
  metrics:
    refresh-interval: 30s
  external-mock:
    scope: preorder
  # 결제 기한이 지난 예약을 만료 취소한다. 태스크마다 돌지만 예약 행을 잠근 뒤 다시 확인해 한 번만 처리된다
  preorder-expiry:
    enabled: true
  # 회차 일정을 바꾸면 catalog-events 로 알린다. catalog 에 처리기(NV-745)가 배포돼 있어야 한다 — 없으면 catalog-events-dlq 로 간다
  # catalog 는 받으면 공개 회차 캐시 세대를 올린다. 꺼진 동안의 변경은 다시 보내지 않는다
  campaign:
    schedule-notice:
      enabled: true
  # 회차 일정에 맞춘 최소 대수(service.yml 의 scales). 오픈 15분 전부터 30분 뒤까지 waitingroom · preorder 최소 대수를 올린다.
  # 대상 · 기본 대수 · 최대 대수는 인프라가 넣으므로 적지 않는다. 실패는 preorder.scaling.failures(경보 '회차 증설 실패')
  # 끌 때: 앱이 마지막에 넣은 최소 대수가 남고 Terraform 은 되돌리지 않는다(app_min). 회차 구간 밖(최소 대수가 기본값일 때) 끄거나,
  # 끈 뒤 두 서비스의 최소 대수를 service.yml 의 min 으로 직접 맞춘다
  scaling:
    enabled: true
    # 오픈 때 preorder 대수. ⌈waitingroom max-global-credit ÷ accept-per-second⌉ 이상이고 service.yml 의 max 이하여야 한다(ecs 스택이 plan 에서 확인)
    preorder:
      surge: 3
    # 태스크 하나가 맡는 예상 방문자 수(waitingroom 대수 = ⌈예상 방문자 ÷ 이 값⌉). 임시값 — NV-761 실측 뒤 바꾼다
    waitingroom:
      visitors-per-task: 5000
  # 태스크 하나가 버티는 초당 접수 수(공유 Redis 하트비트로 waitingroom 이 읽는다). 임시값 — NV-761 실측 뒤 바꾼다
  capacity:
    heartbeat:
      accept-per-second: 100
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        preorder.accept: true
        preorder.events.handle: true
        preorder.events.lag: true

