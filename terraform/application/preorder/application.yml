spring:
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED   # 빠뜨려도 기동은 되지만 부하가 몰리면 교착이 난다
      maximum-pool-size: 10                               # DB 최대 연결 수가 (DB 쓰는 태스크 수 × 10) 이상이어야 한다
  jpa:
    hibernate:
      ddl-auto: validate                                  # 스키마는 Flyway 가 만든다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      timeout: 300ms
      connect-timeout: 200ms
      lettuce:
        pool:
          max-active: 16
          max-wait: 100ms

  threads:
    virtual:
      enabled: true
  http:
    serviceclient:
      catalog:
        connect-timeout: 300ms
        read-timeout: 1s
      order:
        connect-timeout: 300ms
        read-timeout: 1s
jwt:
  issuer: nova
  audience: nova-api
  access-token-validity: 30m
  refresh-token-validity: 14d
nova:
  outbox:
    transport: sqs
    # 커밋 직후 발행 스레드 수(= 발행이 쥐는 커넥션 상한)는 코드 기본값 2 — 덮지 않는다. 32 면 풀(10)을 접수와 다툰다
    relay-interval: 10s
    relay-after: 1m
    relay-batch: 100
    relay-lease: 1m
  sqs:
    api-call-timeout: 3s
    consumer:
      enabled: true
      queue: preorder-events
      concurrency: 1
      wait-seconds: 20
      visibility: 5m
      backoff-base: 30s    # 실패는 대개 DB 장애다. DLQ 로 넘어가기 전 재수신 5회가 장애 조치보다 길게(약 6~12분)
      backoff-max: 5m
    dead-letter:
      enabled: true
      queue: preorder-events-dlq
  admission-ticket:
    secret: ${WAITING_TOKEN_SECRET}
    previous: ${WAITING_TOKEN_PREVIOUS:}
    rollout-ends-at: ${WAITING_TOKEN_ROLLOUT_ENDS_AT:}
  metrics:
    refresh-interval: 30s
  external-mock:
    scope: preorder
  # 결제 기한이 지난 예약을 만료 취소한다. 태스크마다 돌지만 예약 행을 잠근 뒤 다시 확인해 한 번만 처리된다
  preorder-expiry:
    enabled: true
  # 회차 일정을 바꾸면 catalog-events 로 알린다. catalog 에 처리기(NV-745)가 배포돼 있어야 한다 — 없으면 catalog-events-dlq 로 간다
  # catalog 는 받으면 공개 회차 캐시 세대를 올린다. 꺼진 동안의 변경은 다시 보내지 않는다
  campaign:
    schedule-notice:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        preorder.accept: true
        preorder.events.handle: true
        preorder.events.lag: true

