# @Scheduled 작업을 돌리는 상시 앱. 항상 1개만 띄운다
deploy: false                   # 띄우기 전에 운영 DB 이전 · be main 배포 일정과 맞춘다(application.yml 은 채움)
cpu: 512
memory: 1024
port: 0
deployment: singleton           # 옛 태스크를 먼저 내려 같은 작업이 두 번 돌지 않게 한다

db: shop
calls:
  external.mock.base-url: mock  # 정합성 검사가 Mock 원장을 목록 조회 API 로 읽는다. external_mock DB 는 읽지 않는다

upload_cleanup: true            # 안 쓰는 사진 정리. 업로드 버킷 products/ · promotions/ · banners/ 에서 지울 권한과 nova.upload.* 설정을 받는다
