# batch — 정합성 검사 · 안 쓰는 사진 정리. 항상 1개만 띄운다(service.yml 의 deployment: singleton)
# 인프라가 채우는 값(이름, DB 주소, Mock 주소, 업로드 버킷 nova.upload.*)은 적지 않는다.
spring:
  main:
    web-application-type: none                            # HTTP 를 받지 않는다. @Scheduled 작업만 돈다
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED   # 검사 트랜잭션만 코드에서 REPEATABLE READ · 읽기 전용으로 연다
      maximum-pool-size: 10                               # DB 최대 연결 수가 (DB 쓰는 태스크 수 × 10) 이상이어야 한다
      data-source-properties:
        # 드라이버가 DB 응답을 기다리는 상한(밀리초). 검사 제한 시간(30분)은 DB 에 조회 취소를 보내는 방식이라 네트워크가
        # 응답 없이 끊기면 닿지 않는다. 그때도 무한정 기다리지 않게 같은 30분을 둔다. DB 주소는 공통이라 여기서 드라이버 속성으로 준다
        socketTimeout: 1800000
  jpa:
    hibernate:
      ddl-auto: validate                                  # 스키마는 Flyway 가 만든다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

nova:
  batch:
    # 정합성 검사 — 정기 04:00(Asia/Seoul), 관리자 실행 요청 5초마다, 회차 마감 뒤 실행. 기본값을 그대로 쓴다(be batch/application.yml.example)
    image-cleanup:
      dry-run: true                # 지울 대상을 세어 로그만 남긴다. 끄면 실제로 지운다 — catalog 와 확인한 뒤 끈다

# Mock 원장은 목록 조회 API(GET /external/reservations)로 읽는다. 주소(base-url)는 service.yml 의 calls 가 넣는다
external:
  mock:
    connect-timeout: 2s
    read-timeout: 10s
    page-size: 1000
