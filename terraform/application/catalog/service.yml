# 상품 · 옵션 · 카테고리 · 리뷰
deploy: true
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상 또는 버전 태그(0.0.N-rM)
cpu: 1024
memory: 2048
port: 8082
management_port: 9082          # 앱 기본값(CatalogDefaults)과 맞춘다
deployment: blue_green

scaling:
  desired: 1
  min: 1
  max: 4                      # 상품 조회는 사전예약이 열릴 때 같이 몰린다
  requests_per_task: 1400     # 1대가 1분에 받는 요청이 넘으면 바로 늘린다(부하 시험 10-21: 1대 분당 약 2,000건에 CPU 100%)

health:
  port: 9082
  path: /actuator/health/readiness
  matcher: "200"

routes:
  # ALB 조건 값 한도(5개 = 경로 4 + 비밀 헤더 1)를 다 썼다. 경로를 더하려면 규칙을 하나 더 만든다.
  # /internal/* 은 ALB 에 열지 않는다 (preorder · order 가 Service Connect 로 부른다)
  - priority: 50
    paths: ["/api/v1/products*", "/api/v1/admin/products*", "/api/v1/reviews*", "/api/v1/categories*"]
  - priority: 51                # 사전예약 홍보 · 관리자 이미지 업로드 · 메인 배너(고객 /api/v1/banners · 관리자 /api/v1/admin/banners 를 한 패턴으로)
    # 규칙을 새로 만들면 routes 길이가 바뀌어 ECS 서비스가 교체된다(replace_triggered_by — 서비스가 잠깐 내려간다). 경로는 기존 규칙 안에서 늘린다
    paths: ["/api/v1/promotions*", "/api/v1/admin/promotions*", "/api/v1/admin/images*", "/api/v1/*banners*"]

jwt: verify
calls:
  spring.http.serviceclient.order.base-url: order        # 내 주문상품 확인(리뷰) · 재고(목록 · 상세)
  spring.http.serviceclient.member.base-url: member      # 작성자 표시명(리뷰)
  spring.http.serviceclient.preorder.base-url: preorder  # 사전예약 회차 일정(목록 · 상세 · 관리자 수정 판정)
db: shop
redis: main                     # 상품 · 가격 · 홍보 캐시

queues:
  send: [order-events, preorder-events]   # 아웃박스. 상품 등록 → preorder 회차 · 차수, order 초기 재고
  consume: [catalog-events]               # order 가 보낸 일반 상품 판매 준비

uploads: true                   # 상품 · 홍보 · 배너 사진. 업로드 버킷 products/ · promotions/ · banners/ 에 올릴 권한과 nova.upload.* 설정을 받는다

profiling: true                 # 프로파일(Pyroscope)을 보낸다. preorder 에서 부담을 잰 뒤 넓혔다(CPU +0.2%p, 메모리 약 60 MiB)
