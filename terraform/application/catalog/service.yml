# 상품 · 옵션 · 카테고리 · 리뷰
deploy: true
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상 또는 버전 태그(0.0.N-rM)
# 2 vCPU. 1 vCPU 에서는 같은 부하라도 태스크에 따라 CPU 가 포화됐고(부하 시험 10-25 rush 2회: 정상 태스크 p95 0.02초 · CPU 약 60%,
# 포화 태스크 p95 1~2초), 증설로 뜬 태스크는 JIT 예열과 요청이 1 vCPU 를 나눠 써 5분 넘게 p95 2~4초였다(waitingroom 과 같은 이유)
cpu: 2048
memory: 4096
port: 8082
management_port: 9082          # 앱 기본값(CatalogDefaults)과 맞춘다
deployment: blue_green

scaling:
  desired: 2
  min: 2                      # 1대면 20초대 몰림에 CPU 가 막혀 같은 태스크의 상세까지 초 단위로 늦었고(부하 시험 10-22), 전부 Spot 이라 회수되면 비었다
  max: 6                      # 상품 조회는 사전예약이 열릴 때 같이 몰린다. 4대에서 2 → 4 증설이 바로 상한에 닿았다(부하 시험 10-25)
  # 1대가 1분에 받는 요청이 넘으면 바로 늘린다. 1 vCPU 1대는 초당 약 250~420건(분당 1.5만~2.5만)에서 포화됐다(부하 시험 10-25,
  # 느린 쪽 태스크). 2 vCPU 로 그 두 배를 보고 약 70% 에 둔다. 공개 조회 캐시(edge cache_paths.yml) 적용 뒤 같은 rush 로 다시 잰다
  requests_per_task: 20000

health:
  port: 9082
  path: /actuator/health/readiness
  matcher: "200"

routes:
  # ALB 조건 값 한도(5개 = 경로 4 + 비밀 헤더 1)를 다 썼다. 경로를 더하려면 규칙을 하나 더 만든다.
  # /internal/* 은 ALB 에 열지 않는다 (preorder · order 가 Service Connect 로 부른다)
  - priority: 50
    paths: ["/api/v1/products*", "/api/v1/admin/products*", "/api/v1/reviews*", "/api/v1/categories*"]
  - priority: 51                # 사전예약 홍보 · 관리자 이미지 업로드 · 메인 배너(고객 /api/v1/banners · 관리자 /api/v1/admin/banners 를 한 패턴으로)
    # 규칙을 새로 만들면 routes 길이가 바뀌어 ECS 서비스가 교체된다(replace_triggered_by — 서비스가 잠깐 내려간다). 경로는 기존 규칙 안에서 늘린다
    paths: ["/api/v1/promotions*", "/api/v1/admin/promotions*", "/api/v1/admin/images*", "/api/v1/*banners*"]

# 처리 중 요청이 적은 태스크로 보낸다. 부하 시험(10-25 rush 3회)에서 3회 모두 4대로 늘어난 뒤 1대만 막혔고(처리 중 요청 약 200),
# k6 에서 잰 상품 조회의 0.5초 초과는 그 1대가 받은 몫(1/4)과 맞는 약 24%였다. 가용 영역별로 나눠 본 3회차 ALB 응답 시간도
# 막힌 대상이 있던 영역만 p75 2초대였다. 막힌 1대는 3회 모두 증설로 새로 뜬 태스크였다 — 새 대상은 등록 직후 다른 대상의
# 처리 중 요청만큼 한꺼번에 받으므로, 적용 뒤 같은 rush 로 증설 시점의 대상별 응답 시간을 다시 잰다
lb_algorithm: least_outstanding_requests

jwt: verify
calls:
  spring.http.serviceclient.order.base-url: order        # 내 주문상품 확인(리뷰) · 재고(목록 · 상세)
  spring.http.serviceclient.member.base-url: member      # 작성자 표시명(리뷰)
  spring.http.serviceclient.preorder.base-url: preorder  # 사전예약 회차 일정(목록 · 상세 · 관리자 수정 판정)
db: shop
redis: main                     # 상품 · 가격 · 홍보 캐시

queues:
  send: [order-events, preorder-events]   # 아웃박스. 상품 등록 → preorder 회차 · 차수, order 초기 재고
  consume: [catalog-events]               # order 가 보낸 일반 상품 판매 준비 · preorder 가 보낸 회차 일정 변경

uploads: true                   # 상품 · 홍보 · 배너 사진. 업로드 버킷 products/ · promotions/ · banners/ 에 올릴 권한과 nova.upload.* 설정을 받는다

profiling: true                 # 프로파일(Pyroscope)을 보낸다. preorder 에서 부담을 잰 뒤 넓혔다(CPU +0.2%p, 메모리 약 60 MiB)
