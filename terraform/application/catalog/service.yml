# 상품 · 옵션 · 카테고리 · 리뷰
deploy: true
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상
cpu: 1024
memory: 2048
port: 8082
management_port: 9082          # 앱 기본값(CatalogDefaults)과 맞춘다
deployment: blue_green

scaling:
  desired: 1
  min: 1
  max: 4                      # 상품 조회는 사전예약이 열릴 때 같이 몰린다

health:
  port: 9082
  path: /actuator/health/readiness
  matcher: "200"

routes:
  # ALB 조건 값 한도(5개 = 경로 4 + 비밀 헤더 1)를 다 썼다. 경로를 더하려면 규칙을 하나 더 만든다.
  # /internal/* 은 ALB 에 열지 않는다 (preorder · order 가 Service Connect 로 부른다)
  - priority: 50
    paths: ["/api/v1/products*", "/api/v1/admin/products*", "/api/v1/reviews*", "/api/v1/categories*"]
  - priority: 51                # 사전예약 홍보 · 관리자 이미지 업로드
    paths: ["/api/v1/promotions*", "/api/v1/admin/promotions*", "/api/v1/admin/images*"]

jwt: verify
calls:                          # 리뷰 작성 때만 부른다
  spring.http.serviceclient.order.base-url: order     # 내 주문상품 확인
  spring.http.serviceclient.member.base-url: member   # 작성자 표시명
db: shop
redis: main                     # 상품 · 가격 · 홍보 캐시

queues:
  send: [order-events, preorder-events]   # 아웃박스. 상품 등록 → preorder 회차 · 차수, order 초기 재고

uploads: true                   # 상품 이미지. presigned PUT 서명 권한과 nova.upload.* 설정을 받는다

profiling: true                 # 프로파일(Pyroscope)을 보낸다. preorder 에서 부담을 잰 뒤 넓혔다(CPU +0.2%p, 메모리 약 60 MiB)
