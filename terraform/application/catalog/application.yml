# catalog — 상품 · 옵션 · 카테고리 · 리뷰
# 인프라가 채우는 값(이름, 포트, DB · Redis 주소, order · member 주소, JWKS 주소, SQS 리전)은 적지 않는다.
spring:
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED   # 빠뜨려도 기동은 되지만 부하가 몰리면 교착이 난다
      maximum-pool-size: 10                               # DB 최대 연결 수가 (DB 쓰는 태스크 수 × 10) 이상이어야 한다
  jpa:
    hibernate:
      ddl-auto: validate                                  # 스키마는 Flyway 가 만든다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      timeout: 300ms
      connect-timeout: 200ms
      lettuce:
        pool:
          max-active: 16
          max-wait: 100ms

# 상품 정보만 캐시한다. 재고는 캐시하지 않는다 (지난 재고로 초과 판매가 난다)
cache:
  product-ttl: 10m
  price-ttl: 1m

jwt:
  issuer: nova                     # member 와 같아야 검증이 통과한다
  audience: nova-api

nova:
  outbox:
    transport: sqs                 # 필수. 운영 값은 sqs
  read-cache:
    # 공개 조회(회원 상세 · 홍보 카드 · 후기 · 조회 신호)의 사전예약 회차 캐시. 없거나 0s 이하거나 nova.read-cache.enabled=false 면 끔(요청마다 preorder 에 묻는다)
    # 회차 변경은 preorder 의 일정 변경 알림(catalog-events)을 받아 비운다 — preorder 의 schedule-notice.enabled 를 켠 뒤에 켠다
    # 알림을 놓쳤을 때(DLQ) 조기 마감 · 다시 열기 · 일정 변경이 늦게 보이는 시간은 최대 이 값이다(상세 · 홍보는 앞단 HTTP 캐시 5초가 더해지고, 서버 시계 차는 어디나 더해진다)
    # catalog-events-dlq 경보가 울리면 DLQ 를 다시 흘리거나, 앱이 세대를 올릴 때와 같은 스크립트로 한 번 올린다(키가 없을 때도 맞다. 생 INCR 은 쓰지 않는다)
    # 셸에서 친다(대화형 valkey-cli 면 $NOW_MS 자리에 숫자를 직접 넣는다). NOW_MS 는 지금 시각의 epoch 밀리초(13자리)다. 초가 아니다. 13자리 숫자가 아니면 아무것도 쓰지 않고 거절한다
    #   NOW_MS=$(python3 -c 'import time;print(int(time.time()*1000))')
    #   valkey-cli <접속 옵션> EVAL "if not string.match(ARGV[1],'^[1-9]%d+$') or #ARGV[1]~=13 then return redis.error_reply('ARGV[1] must be epoch ms (13 digits)') end if redis.call('EXISTS',KEYS[1])==0 then redis.call('SET',KEYS[1],ARGV[1]) end return redis.call('INCR',KEYS[1])" 1 catalog:cache:gen:preorder-campaigns "$NOW_MS"
    preorder-campaign-ttl: 30m
