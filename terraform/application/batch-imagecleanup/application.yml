# batch-imagecleanup — 안 쓰는 사진 정리. 한 번 돌고 종료한다(실행 시각은 service.yml 의 schedule)
# 인프라가 채우는 값(이름, DB 주소, 업로드 버킷 nova.upload.*)은 적지 않는다.
spring:
  main:
    web-application-type: none                            # HTTP 를 받지 않는다
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED
      maximum-pool-size: 10                               # DB 최대 연결 수가 (DB 쓰는 태스크 수 × 10) 이상이어야 한다
      data-source-properties:
        # 드라이버가 DB 응답을 기다리는 상한(밀리초). 네트워크가 응답 없이 끊기면 정리가 끝나지 않아 태스크가 종료되지 않고,
        # 이름 잠금을 쥔 채 남아 다음 실행은 건너뛰기만 한다. 정합성 검사와 같은 30분을 둔다
        socketTimeout: 1800000
  jpa:
    hibernate:
      ddl-auto: validate                                  # 스키마는 Flyway 가 만든다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false

nova:
  batch:
    image-cleanup:
      dry-run: true                # 지울 대상을 세어 로그만 남긴다. 끄면 실제로 지운다 — catalog 와 확인한 뒤 끈다
