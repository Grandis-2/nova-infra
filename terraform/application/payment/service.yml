# 결제(토스). 외부에 노출하지 않고 order 만 /internal 로 호출한다
deploy: true
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상 또는 버전 태그(0.0.N-rM)
cpu: 1024
memory: 2048
port: 8085
management_port: 9086           # 앱 기본값(PaymentDefaults)과 같다
deployment: rolling

scaling:
  desired: 1
  min: 1
  max: 5

jwt: verify
db: shop
redis: main

queues:
  # payment-events 는 자기 큐다 — DLQ 되돌리기가 원래 큐로 다시 보낸다. dlq 는 DLQ 를 읽기만 해서 보내기는 여기 둔다
  send: [order-events, payment-events]
  consume: [payment-events]
  dlq: [payment-events]   # DLQ 메시지를 DB 로 옮긴다. 관리자 API 는 order 가 받아 /internal 로 넘긴다

profiling: true                 # 프로파일(Pyroscope)을 보낸다. preorder 에서 부담을 잰 뒤 넓혔다(CPU +0.2%p, 메모리 약 60 MiB)
