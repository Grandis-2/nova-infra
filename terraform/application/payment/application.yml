spring:
  datasource:
    hikari:
      transaction-isolation: TRANSACTION_READ_COMMITTED   # 빠뜨려도 기동은 되지만 부하가 몰리면 교착이 난다
      maximum-pool-size: 10                               # DB 최대 연결 수가 (DB 쓰는 태스크 수 × 10) 이상이어야 한다
  jpa:
    hibernate:
      ddl-auto: validate                                  # 스키마는 Flyway 가 만든다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    open-in-view: false
  data:
    redis:
      # 폐기 표식(로그아웃 · 제재) 조회. 응답이 늦으면 모든 인증 요청이 늦어지므로 짧게 끊는다
      timeout: 300ms
      connect-timeout: 200ms
  task:
    scheduling:
      # 주기 작업(승인 복구 · 환불 · 결제창 만료)이 서로 밀리지 않게 3. 종료 때 진행 중인 토스 호출(최대 63초)을 기다린다
      pool:
        size: 3
      shutdown:
        await-termination: true
        await-termination-period: 75s
  http:
    serviceclient:
      # 토스 결제 승인 · 취소 · 조회. 샌드박스 · 운영 주소가 같고 키(test_sk_ · live_sk_)로 갈린다.
      # 연결 3 + 읽기 60 ≤ 리스 70 이 아니거나 리다이렉트를 따라가면 기동하지 않는다(TossHttpSettingsVerifier)
      toss:
        base-url: https://api.tosspayments.com
        connect-timeout: 3s
        read-timeout: 60s
        redirects: dont-follow

# DEBUG 에서 RestClient 가 요청 URL 을 찍는다 — 취소 · 조회 URL 에 토스 결제 키가 들어 있어 낮추지 않는다
logging:
  level:
    org.springframework.web.client: INFO

jwt:
  issuer: nova
  audience: nova-api
  access-token-validity: 30m
  refresh-token-validity: 14d

nova:
  payment:
    toss:
      secret-key: ${TOSS_SECRET_KEY}   # secrets.sops.yml → Secrets Manager → 환경변수
    # 주기 작업. 끄면 결과 불명 거래 · 환불 · 시작 안 된 결제창이 영영 남는다
    jobs:
      enabled: true
    recovery:
      interval: 5s
    refund:
      interval: 5s
    expiry:
      interval: 60s
  outbox:
    transport: sqs
    concurrency: 32
    relay-interval: 10s
    relay-after: 1m
    relay-batch: 100
    relay-lease: 1m          # 전송 한 번(sqs.api-call-timeout 의 두 배)보다 길어야 한다(아니면 기동 실패)
  sqs:
    api-call-timeout: 3s
    consumer:
      enabled: true
      queue: payment-events
      concurrency: 1
      wait-seconds: 20
      visibility: 5m         # 처리 한 건보다 길게
      backoff-base: 30s      # 실패는 대개 DB 장애 — 재수신 5회(DLQ 전)가 장애 조치보다 길게(약 7분)
      backoff-max: 5m

# 폐기 표식 조회가 실패(Redis 장애)했을 때 401 로 닫는 경로. 내부 API 도 닫는다(호출자 order 가 빠뜨려도 여기서 막는다)
auth:
  revocation-check:
    fail-closed-paths:
      - /api/v1/admin/**
      - /api/v1/session/refresh
      - /api/v1/me/**
      - /internal/**
