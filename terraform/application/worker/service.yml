# mock(외부 시스템) 연동 — 큐를 소비해 mock 을 부르고 결과를 이벤트로 돌려준다. 상태는 메시지 속성에 있다
#   사전예약: preorder-register · preorder-cancel → 외부 예약 등록 · 취소 → preorder-events
#   럭키드로우: draw-register → 응모 전달 · 응모 수 대조 · 추첨 → order-events
deploy: true
image_tag: latest               # release 가 올린 최신. 되돌리려면 커밋 해시 앞 6자리 이상
cpu: 1024
memory: 2048
port: 9087                      # health · prometheus 만 연다 (앱 기본값 WorkerDefaults). 외부 경로(routes)는 없다
deployment: rolling
spot: true                      # 중단돼도 메시지가 큐에 남아 재처리된다
# 정상 종료가 최악 약 35초 걸린다 (롱 폴링 5초 + 처리 20초 + 두 번째 큐 롱 폴링 5초 + 삭제).
# 넘으면 처리 중에 강제 종료돼 그 차례가 가시성 시간(120초) 뒤로 밀린다. 앱 nova.worker.consumer.stop-timeout(20초)과 함께 바꾼다
stop_timeout: 60

# ALB 대상이 아니므로 컨테이너 헬스체크로 쓴다
health:
  port: 9087
  path: /actuator/health/readiness

scaling:
  desired: 1
  min: 1
  max: 4                      # worker 하나가 mock 최대 5대 몫(16 × 5)까지 보낸다
  backlog:
    queues: [preorder-register, preorder-cancel, draw-register]   # 세 큐의 합. 어느 하나만 쌓여도 늘어난다
    per_task: 50              # 추정값. 부하 시험 뒤 다시 정한다

calls:
  nova.worker.mock.base-url: mock
# worker 는 DB 를 쓰지 않지만 계정은 남겨 둔다. 빼면 ncp-database 의 사용자 목록이 바뀌는데, NCP provider 는
# 목록이 조금만 바뀌어도 모든 서비스 계정을 지우고 다시 만든다(RequiresReplace). 서비스별 리소스로 나눈 뒤 뺀다
db: shop

queues:
  consume: [preorder-register, preorder-cancel, draw-register]
  # 결과 이벤트는 preorder-events(사전예약) · order-events(추첨 결과), 재시도는 같은 큐에 지연을 두고 다시 보낸다
  send: [preorder-events, order-events, preorder-register, preorder-cancel, draw-register]
  # 다시 보내도 같은 확정 거절(be 계약 contracts/draw-entry-sync.md)은 재시도하지 않고 DLQ 에 바로 넣는다
  dlq_send: [draw-register]

profiling: true                 # 프로파일(Pyroscope)을 보낸다. preorder 에서 부담을 잰 뒤 넓혔다(CPU +0.2%p, 메모리 약 60 MiB)
