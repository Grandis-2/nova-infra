# Pyroscope 수신 전용 프록시 — 앱이 닿는 포트(4041)에는 프로파일 올리기(POST /ingest)만 연다.
# Pyroscope 의 4040 은 수신과 조회 API 를 함께 내서, 앱 태스크가 4040 에 닿으면 Grafana 인증 없이 다른 서비스의 프로파일을 읽을 수 있다.
# 그래서 앱(Service Connect pyroscope.<네임스페이스>:4040 → 이 컨테이너 4041)은 여기를 지나고,
# Pyroscope 4040 은 같은 태스크 안(Grafana · Collector, localhost)에서만 쓴다. obs 보안 그룹도 4041 만 연다.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 256;
}

http {
  access_log off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  # JFR 한 번 올리는 크기(15초 분량, 할당 · 락 포함)는 보통 수백 KB 다. 여유를 두되 /tmp(tmpfs 16 MiB)보다 작게 둔다
  client_max_body_size 8m;

  server {
    listen 4041;

    location = /ingest {
      limit_except POST {
        deny all;
      }
      # 본문을 임시 파일로 받지 않고 바로 흘려보낸다(/tmp 를 쓰지 않는다)
      proxy_request_buffering off;
      proxy_pass http://127.0.0.1:4040;
    }

    location / {
      return 403;
    }
  }
}
