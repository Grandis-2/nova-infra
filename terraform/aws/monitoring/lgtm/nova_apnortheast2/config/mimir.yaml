# 단일 바이너리 Mimir(-target=all). 블록 · 경보 규칙 · Alertmanager 상태는 S3 한 버킷에 접두사로 나눠 두고,
# 아직 블록이 되지 않은 시계열(TSDB head · WAL)은 로컬 디스크(/data).
# -config.file=/config/mimir.yaml -config.expand-env=true 로 띄운다. 값은 ECS 작업 정의가 넘긴다:
#   MIMIR_S3_BUCKET · MIMIR_S3_REGION · MIMIR_RETENTION (필수)
#   MIMIR_S3_ENDPOINT (없으면 s3.ap-northeast-2.amazonaws.com — 아래 endpoint 주석)
#   MIMIR_S3_INSECURE · MIMIR_S3_BUCKET_LOOKUP_TYPE (로컬 S3 대체용. 실제 AWS 에서는 넘기지 않는다)
# Mimir 의 기본값 문법은 ${VAR:기본값} 이다(Loki 의 ${VAR:-기본값} 과 다르다).
#
# 자격 증명은 여기 없다. 비어 있으면 SDK 기본 체인을 쓴다 — ECS 에서는 태스크 역할이다.
#
# obs 태스크의 컨테이너는 localhost 를 같이 쓴다(awsvpc). 포트:
#   9009  HTTP (OTLP 수신 /otlp/v1/metrics — Collector 만 보낸다, PromQL 조회 /prometheus — Grafana)
#   9098  gRPC (내부)
# 링은 모두 메모리에 둔다(한 대뿐이다). 그래도 Mimir 3 는 memberlist 를 띄우므로 7946 을 피해 127.0.0.1:7947 에만 묶는다.
# 사람 · 앱이 지표를 직접 넣는 경로는 없다. 앱은 Collector 로 보낸다.

target: all
# 테넌트는 하나(anonymous)다. 인증이 없다 — 태스크 안에서만 닿는다
multitenancy_enabled: false

# 기본값은 작업 디렉터리(/)의 파일이라 UID 10001 로는 만들지 못한다. 데이터 디스크에 둔다
activity_tracker:
  filepath: /data/metrics-activity.log

server:
  http_listen_port: 9009
  grpc_listen_port: 9098
  log_level: warn

common:
  storage:
    backend: s3
    s3:
      bucket_name: ${MIMIR_S3_BUCKET}
      region: ${MIMIR_S3_REGION}
      # Mimir 는 endpoint 가 비면 뜨지 않고, 기본값 안에 다른 변수를 쓸 수 없다(${VAR:기본값} 이 중첩되지 않는다).
      # 그래서 기본값이 리전 고정이다. 리전을 바꾸면 MIMIR_S3_ENDPOINT 를 넘기거나 이 값을 같이 바꾼다
      endpoint: ${MIMIR_S3_ENDPOINT:s3.ap-northeast-2.amazonaws.com}
      insecure: ${MIMIR_S3_INSECURE:false}
      bucket_lookup_type: ${MIMIR_S3_BUCKET_LOOKUP_TYPE:auto}

# 한 버킷 안의 접두사. s3 스택의 mimir 버킷에 만료 수명주기가 없는 이유다(ruler · alertmanager 는 날짜로 지우면 안 된다)
blocks_storage:
  storage_prefix: blocks
  tsdb:
    dir: /data/tsdb
    # 정상 종료(작업 정의의 stopTimeout 안)면 아직 블록이 아닌 시계열도 블록으로 만들어 S3 로 올린다. Loki 의 flush_on_shutdown 과 같다
    flush_blocks_on_shutdown: true
  bucket_store:
    sync_dir: /data/tsdb-sync
    # 버킷을 다시 훑는 주기(기본 15분). 한 대 · 작은 버킷이라 짧게 둔다 — 로컬 디스크를 잃고 다시 떴을 때 S3 의 블록을 빨리 읽는다
    sync_interval: 1m
    # 한 대라 최근 블록도 S3 에서 바로 읽게 한다(아래 querier.query_store_after 와 짝).
    # 기본값(10시간)이면 로컬 디스크를 잃은 뒤 최근 10시간 지표를 S3 에 있어도 못 읽는다
    ignore_blocks_within: 0s

ruler_storage:
  storage_prefix: ruler

alertmanager_storage:
  storage_prefix: alertmanager

querier:
  # 기본값(12시간)이면 최근 지표는 ingester(로컬)에서만 읽는다. 위 ignore_blocks_within 과 같은 이유로 0 이다
  query_store_after: 0s

# 조회 대기열. 대시보드를 열면 패널 · 변수 쿼리가 한꺼번에 들어오는데, 기본 한도(100)를 넘으면 나머지는 429(too many outstanding
# requests)로 바로 실패한다. 처리하는 querier 는 그대로(max_concurrent 8)라 넘친 쿼리는 실패하지 않고 줄을 서서 기다린다
query_scheduler:
  max_outstanding_requests_per_tenant: 1000

memberlist:
  bind_addr: [127.0.0.1]
  bind_port: 7947

compactor:
  data_dir: /data/compactor
  # 버킷 인덱스(bucket-index.json.gz)를 다시 쓰는 주기(기본 15분). 새 블록이 조회에 보이는 시점이 이것에 달려 있다
  cleanup_interval: 5m
  sharding_ring:
    kvstore:
      store: inmemory

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1

store_gateway:
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1

ruler:
  rule_path: /data/ruler
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

alertmanager:
  data_dir: /data/alertmanager
  sharding_ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1

limits:
  # 보존 기간. 지나면 compactor 가 S3 의 블록을 지운다
  compactor_blocks_retention_period: ${MIMIR_RETENTION}
  # OTLP 지표 이름에 단위 · 종류 접미사를 붙인다(http.server.request.duration [s] → http_server_request_duration_seconds_*,
  # 카운터 → *_total). Prometheus 관례와 같아 대시보드 · 경보가 흔한 이름을 쓴다. Mimir 3 의 기본값은 붙이지 않는다
  otel_metric_suffixes_enabled: true
  # OTLP 리소스 속성 중 대시보드가 거르는 것만 시계열 라벨로 올린다(나머지는 target_info 에만 남는다)
  promote_otel_resource_attributes: "service.namespace,deployment.environment"
  # 쿼리 샤딩을 끈다. 켜면 쿼리 하나를 최대 16개로 쪼개 대기열에 넣는데, 한 대 · querier 8개에서는 빨라지지 않고
  # 대기열만 그만큼 찬다(위 query_scheduler 한도)
  query_sharding_total_shards: 0
  # 늦게 도착한 샘플을 30분까지 받는다. OTel 게이트웨이(NV-543)는 obs 재배포 동안 쌓아 둔 지표를 여러 번에 나눠 다시 보내는데,
  # 보내는 순서가 섞이면 이미 받은 시각보다 이른 샘플이 온다. 이 창이 없으면 그 샘플을 버린다(err-mimir-sample-out-of-order).
  # 게이트웨이 재시도(15분)와 배포 때 두 태스크가 겹치는 시간을 덮는다
  out_of_order_time_window: 30m

# 사용 통계를 grafana.com 으로 보내지 않는다.
usage_stats:
  enabled: false
