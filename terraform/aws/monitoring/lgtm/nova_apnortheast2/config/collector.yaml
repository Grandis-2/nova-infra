# obs 태스크의 OTel Collector. 로그 → Loki, 트레이스 → Tempo, 지표 → Mimir.
#
# 실행 환경마다 다른 값은 환경 변수로 받는다. obs 태스크의 컨테이너는 localhost 를 같이 쓴다(awsvpc).
#   LOKI_OTLP_ENDPOINT   Loki 의 OTLP 수신 주소. http://localhost:3100/otlp
#   TEMPO_OTLP_ENDPOINT  Tempo 의 OTLP gRPC 수신 주소. localhost:14317
#   MIMIR_OTLP_ENDPOINT  Mimir 의 OTLP 수신 주소. http://localhost:9009/otlp
#   MYSQLD_EXPORTER_TARGET  mysqld_exporter 주소(localhost:9104). 띄우지 않으면 비운다 — 그때는 아무것도 긁지 않는다
#   OBS_DATA_MOUNT_PATH  obs 인스턴스의 데이터 EBS 경로(/data/obs). hostmetrics 가 루트와 함께 이 디스크의 사용률을 본다
#
# 포트: 4317 · 4318 (OTLP 수신), 8888 (자체 지표, localhost), 13133 (헬스체크 — 작업 정의의 컨테이너 헬스체크가 부른다)
#
# 이 경로는 손실을 허용한다 — 디스크 큐가 없고, 메모리가 차면 memory_limiter 가 받기를 거부한다.
# 정본이 필요한 기록은 이 경로에 기대지 않는다.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # 지표를 OTLP 로 내지 않는 것들은 긁어 온다(30초).
  #   otel-collector: 이 Collector 자신(수신 · 거부 · 내보내기 실패 수). obs 수집 경로 경보가 쓴다.
  #     Mimir 에서는 job="otelcol-contrib" 다(자기 지표의 service.name 이 job_name 보다 우선한다)
  #   mysqld: DB(mysqld_exporter). MYSQLD_EXPORTER_TARGET 이 비면 대상이 없다
  #   loki · tempo · mimir · grafana: 관측 스택 자신(같은 태스크의 localhost). job 라벨이 그대로 이 이름이다
  prometheus/scrape:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:8888"]
        - job_name: mysqld
          scrape_interval: 30s
          static_configs:
            - targets: ["${env:MYSQLD_EXPORTER_TARGET}"]
          # 대상이 빈 문자열이면 버린다(빈 주소를 긁으려다 오류를 내지 않게)
          relabel_configs:
            - source_labels: [__address__]
              regex: ""
              action: drop
          # 다이제스트(SQL 형태)마다 붙는 지표 중 화면 · 경보가 쓰지 않는 것과 메모리 할당 · 해제 누적은 버린다.
          # 다이제스트 지표는 형태 하나에 한 벌씩 생겨 남기는 것만으로 수백 시계열이다
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "mysql_perf_schema_events_statements_((cpu_time_seconds|rows_affected|sort_merge_passes|sort_rows|tmp_tables|warnings)_total|latency(_sum|_count)?)|mysql_perf_schema_memory_events_(alloc|free)_bytes_total"
              action: drop
        # 관측 스택 자신. 화면(LGTM 스택 대시보드)과 경보가 보는 것만 남긴다(전부 받으면 한가할 때도 약 7천 시계열)
        - job_name: loki
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:3100"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "loki_(distributor_(bytes|lines)_received_total|discarded_(samples|bytes)_total|ingester_memory_(streams|chunks)|ingester_flush_queue_length|ingester_wal_disk_full_failures_total|request_duration_seconds_(count|sum))|process_(resident_memory_bytes|cpu_seconds_total)"
              action: keep
        - job_name: tempo
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:3200"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "tempo_(distributor_spans_received_total|discarded_spans_total|ingester_live_traces|ingester_failed_flushes_total|request_duration_seconds_(count|sum))|tempodb_(compaction|retention)_errors_total|process_(resident_memory_bytes|cpu_seconds_total)"
              action: keep
        - job_name: mimir
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:9009"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "cortex_(distributor_received_samples_total|discarded_samples_total|ingester_memory_series|query_scheduler_(queue_length|queue_duration_seconds_(count|sum)|queue_max_wait_seconds)|request_duration_seconds_(count|sum)|ingester_tsdb_(wal_writes_failed|compactions_failed)_total)|thanos_objstore_bucket_operation_failures_total|process_(resident_memory_bytes|cpu_seconds_total)"
              action: keep
        - job_name: grafana
          scrape_interval: 30s
          static_configs:
            - targets: ["localhost:3000"]
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: "grafana_(alerting_rule_evaluations_total|alerting_rule_evaluation_failures_total|http_request_duration_seconds_(count|sum)|datasource_request_total)|process_(resident_memory_bytes|cpu_seconds_total)"
              action: keep

  # obs EC2 호스트(CPU · 메모리 · 디스크). 작업 정의가 호스트 / 를 읽기 전용으로 /hostfs 에 붙인다.
  # 디스크는 루트(이미지 · 로그)와 데이터 EBS(Loki · Tempo · Mimir · Grafana)만 본다
  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization: {enabled: true}
      memory:
        metrics:
          system.memory.utilization: {enabled: true}
      load: {}
      filesystem:
        metrics:
          system.filesystem.utilization: {enabled: true}
        include_mount_points:
          match_type: strict
          mount_points: ["/", "${env:OBS_DATA_MOUNT_PATH}"]

processors:
  # 컨테이너 메모리 한도(1 GiB) 안에서 GC 여유를 남긴다. tail_sampling 이 결정 전 트레이스를 메모리에 든다.
  memory_limiter:
    check_interval: 1s
    limit_mib: 768
    spike_limit_mib: 192
  batch:
    timeout: 1s

  # hostmetrics 에는 서비스 이름이 없어 Mimir 의 job 라벨이 비고 다른 시계열과 섞인다. job="obs-host" 가 되게 한다
  resource/obs-host:
    attributes:
      - key: service.name
        value: obs-host
        action: upsert

  # 카디널리티 예산. 리소스 속성은 남길 것만 고른다(빼는 방식이 아니라 남기는 방식).
  # 여기를 통과한 리소스 속성은 Loki 에서 인덱스 라벨(loki.yaml 의 index_label)이거나
  # structured metadata 가 된다. 목록에 없는 속성은 저장되지 않는다.
  #
  # process.pid · process.command_args · os.description 은 조회 축이 아니면서 길거나 재시작마다 바뀐다.
  # aws.ecs.* 는 넣지 않았다. aws.ecs.task.arn · cluster.arn 에 계정 ID 가 들어 있고,
  # 태스크를 가리키는 데는 service.instance.id 와 host.name 으로 충분하다.
  # 로그 · 트레이스 · 지표에 같은 목록을 쓴다.
  transform/resource-allowlist:
    error_mode: ignore
    log_statements:
      - context: resource
        statements:
          - &resource_allowlist keep_keys(attributes, [
              "service.name",
              "service.version",
              "service.namespace",
              "service.instance.id",
              "deployment.environment",
              "deployment.environment.name",
              "k8s.cluster.name",
              "k8s.namespace.name",
              "k8s.pod.name",
              "k8s.deployment.name",
              "host.name"
            ])
    trace_statements:
      - context: resource
        statements:
          - *resource_allowlist
    metric_statements:
      - context: resource
        statements:
          - *resource_allowlist

  # 저장 전 마스킹. 어느 경로(Grafana · Loki API)로 읽어도 원문이 없게, Loki 에 넘기기 전에 지운다. 되돌릴 수 없다.
  # 안전망이다 — 1차 방어는 앱이 애초에 남기지 않는 것이다. 결정과 한계는 README.md "저장 전 마스킹".
  #
  # 대상
  #   로그 본문: 맵 · 목록이면 먼저 JSON 문자열로 바꾼다. Loki 는 원래 그 JSON 을 줄로 저장하므로 저장되는 모습은 같고,
  #     중첩된 값까지 문자열 패턴이 닿는다. 숫자 · 불리언 · 바이트 본문은 그대로 둔다.
  #   로그 레코드 속성: 문자열 값 전부(exception.message · exception.stacktrace 포함).
  #     맵 · 목록 속성 안에 중첩된 값은 보지 않는다(replace_all_patterns 는 한 단계만 본다).
  #   리소스 속성은 위 허용 목록이 서비스 · 호스트 식별자만 남긴다. 스코프 속성은 보지 않는다.
  #
  # 순서와 패턴(Go RE2. 앞뒤 보기가 없어 경계 문자를 잡았다가 $${1} · $${2} 로 되돌려 놓는다. $ 는 설정 파일에서 $$ 로 쓴다)
  #   1. 중복 키: MySQL 의 Duplicate entry '<값>' for key 에서 <값>. 키 이름과 상관없이, 한 줄 안에서만.
  #   2. 이메일: local@domain.tld 와 URL 인코딩된 local%40domain.tld. 전화보다 먼저 해야 hong.010…@ 이 통째로 가려진다.
  #   3. +82 전화: +82 · %2B82 · 0082, (0) 허용.  4. 국내 전화: 010 · 011 · 016~019, 괄호 · 구분자(- . 공백) 허용.
  #   경계: 앞뒤가 16진수 문자가 아니어야 한다(+82 · %2B82 는 + · % 가 앞 경계라서 앞을 보지 않는다). UUID · trace ID · 16진수 ID 의 일부는 걸리지 않고,
  #     \n · _ · 한글 바로 옆의 번호는 걸린다. 대가: 16진수 글자(a-f) 바로 옆에 붙은 번호(phone010…, 010…abc)는 걸리지 않는다.
  #   3 · 4 를 두 번씩 하는 것은 경계 문자를 하나 소비해서, 붙어 있는 두 번호 중 뒤의 것이 첫 번에 빠지기 때문이다.
  #
  # error_mode: ignore — 문 하나가 실패하면 그 문만 건너뛰고 다음 문으로 간다. propagate 는 배치 전체를 버린다(503).
  transform/mask:
    error_mode: ignore
    log_statements:
      - context: log
        statements:
          - set(log.body, String(log.body)) where IsMap(log.body) or IsList(log.body)
          - replace_pattern(log.body, "Duplicate entry '[^\\n]*?' for key", "Duplicate entry '<masked>' for key") where IsString(log.body)
          - replace_pattern(log.body, "[A-Za-z0-9._%+-]+(?:@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>") where IsString(log.body)
          - replace_pattern(log.body, "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}") where IsString(log.body)
          - replace_pattern(log.body, "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}") where IsString(log.body)
          - replace_pattern(log.body, "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}") where IsString(log.body)
          - replace_pattern(log.body, "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}") where IsString(log.body)
          - replace_all_patterns(log.attributes, "value", "Duplicate entry '[^\\n]*?' for key", "Duplicate entry '<masked>' for key")
          - replace_all_patterns(log.attributes, "value", "[A-Za-z0-9._%+-]+(?:@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>")
          - replace_all_patterns(log.attributes, "value", "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(log.attributes, "value", "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(log.attributes, "value", "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(log.attributes, "value", "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")

  # 트레이스 샘플링. 트레이스가 끝나기를 decision_wait 동안 기다렸다가 남길지 정한다(앱은 모두 보낸다: parentbased_always_on).
  #   버림(먼저 본다): 헬스체크(/actuator/*) 서버 스팬이 든 트레이스, 메시지 없이 끝난 SQS 롱폴링(ReceiveMessage).
  #     몇 초마다 생겨 저장량의 대부분을 차지하고 볼 일이 없다. 오류가 난 롱폴링은 남긴다.
  #   남김: 오류(ERROR)가 있는 트레이스, 1초 넘게 걸린 트레이스는 전부. 나머지는 10%.
  #   앱에서 10% 로 자르면 버려진 90% 안의 오류 트레이스를 다시 찾을 수 없어서 여기서 자른다.
  # 결정 전의 트레이스를 메모리에 든다. num_traces 를 넘으면 오래된 것부터 결정 없이 버린다(손실 허용).
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 200
    policies:
      - name: drop-noise
        type: drop
        drop:
          drop_sub_policy:
            - name: health-and-empty-poll
              type: ottl_condition
              ottl_condition:
                error_mode: ignore
                span:
                  - 'kind == SPAN_KIND_SERVER and IsMatch(attributes["url.path"], "^/actuator(/|$$)")'
                  - 'attributes["rpc.method"] == "ReceiveMessage" and status.code != STATUS_CODE_ERROR and (attributes["messaging.batch.message_count"] == nil or attributes["messaging.batch.message_count"] == 0)'
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 1000
      - name: rest
        type: probabilistic
        probabilistic:
          sampling_percentage: 10

  # 스팬 저장 전 마스킹. 로그의 transform/mask 와 같은 패턴 · 순서다(바꿀 때 둘을 같이 바꾼다).
  #   스팬 속성 · 스팬 이벤트 속성(exception.message · exception.stacktrace) · 상태 메시지의 문자열 값
  #   URL 쿼리 문자열: 값만 지운다(이름은 남긴다). url.query · url.full 과 옛 이름 http.url · http.target
  #     토큰 · 개인정보가 쿼리로 오면 패턴에 안 걸리는 값도 있어서 쿼리 값은 통째로 지운다.
  #   SQL(db.query.text · db.statement)의 리터럴은 에이전트가 ? 로 바꿔 보낸다(기본값). 여기서는 위 패턴만 더 건다.
  transform/mask-spans:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          - replace_pattern(span.attributes["url.query"], "([^=&]+)=[^&]*", "$${1}=<masked>")
          - replace_pattern(span.attributes["url.full"], "([?&][^=&#]+)=[^&#]*", "$${1}=<masked>")
          - replace_pattern(span.attributes["http.url"], "([?&][^=&#]+)=[^&#]*", "$${1}=<masked>")
          - replace_pattern(span.attributes["http.target"], "([?&][^=&#]+)=[^&#]*", "$${1}=<masked>")
          - replace_all_patterns(span.attributes, "value", "Duplicate entry '[^\\n]*?' for key", "Duplicate entry '<masked>' for key")
          - replace_all_patterns(span.attributes, "value", "[A-Za-z0-9._%+-]+(?:@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>")
          - replace_all_patterns(span.attributes, "value", "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(span.attributes, "value", "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(span.attributes, "value", "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(span.attributes, "value", "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_pattern(span.status.message, "Duplicate entry '[^\\n]*?' for key", "Duplicate entry '<masked>' for key")
          - replace_pattern(span.status.message, "[A-Za-z0-9._%+-]+(?:@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>")
          - replace_pattern(span.status.message, "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_pattern(span.status.message, "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_pattern(span.status.message, "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_pattern(span.status.message, "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
      - context: spanevent
        statements:
          - replace_all_patterns(spanevent.attributes, "value", "Duplicate entry '[^\\n]*?' for key", "Duplicate entry '<masked>' for key")
          - replace_all_patterns(spanevent.attributes, "value", "[A-Za-z0-9._%+-]+(?:@|%40)[A-Za-z0-9.-]+\\.[A-Za-z]{2,}", "<masked:email>")
          - replace_all_patterns(spanevent.attributes, "value", "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(spanevent.attributes, "value", "(?:\\+|%2[Bb]|(^|[^0-9A-Fa-f])00)82[-. ]?(?:\\(0\\)[-. ]?)?0?1[016789][-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(spanevent.attributes, "value", "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")
          - replace_all_patterns(spanevent.attributes, "value", "(^|[^0-9A-Fa-f])\\(?01[016789]\\)?[-. ]?[0-9]{3,4}[-. ]?[0-9]{4}([^0-9A-Fa-f]|$$)", "$${1}<masked:phone>$${2}")

exporters:
  otlphttp/loki:
    endpoint: ${env:LOKI_OTLP_ENDPOINT}
    tls:
      insecure: true
  # 같은 태스크 안의 Tempo(localhost). 태스크 밖으로 나가지 않아 TLS 를 쓰지 않는다
  otlp/tempo:
    endpoint: ${env:TEMPO_OTLP_ENDPOINT}
    tls:
      insecure: true
  # 같은 태스크 안의 Mimir(localhost). Mimir 가 OTLP 를 Prometheus 시계열로 바꾼다(단위 접미사 · 리소스 속성은 target_info)
  otlphttp/mimir:
    endpoint: ${env:MIMIR_OTLP_ENDPOINT}
    tls:
      insecure: true

service:
  extensions: [health_check]
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, transform/resource-allowlist, transform/mask, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/resource-allowlist, tail_sampling, transform/mask-spans, batch]
      exporters: [otlp/tempo]
    metrics:
      receivers: [otlp, prometheus/scrape]
      processors: [memory_limiter, transform/resource-allowlist, batch]
      exporters: [otlphttp/mimir]
    metrics/host:
      receivers: [hostmetrics]
      processors: [memory_limiter, resource/obs-host, batch]
      exporters: [otlphttp/mimir]
  telemetry:
    logs:
      level: info
    # 자체 지표(수신 · 거부 · 내보내기 실패 수). 같은 태스크 안에서만 읽는다
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: localhost
                port: 8888
