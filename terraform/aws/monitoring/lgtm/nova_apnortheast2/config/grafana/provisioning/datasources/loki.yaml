# Grafana 데이터소스 — Loki. Tempo 는 tempo.yaml, 지표(Mimir)는 mimir.yaml.
# LOKI_URL 은 Grafana 컨테이너 환경 변수다. obs 태스크 안에서는 http://localhost:3100
#
# 로그 → 트레이스: 에이전트가 로그 레코드에 trace_id 를 붙이고, Loki 는 그것을 structured metadata 로 저장한다.
# derivedFields 가 그 값으로 Tempo 링크를 만든다(로그 줄을 펼치면 "Tempo" 버튼).
# 엣지 접근 로그(alb · cloudfront)에는 trace_id 가 없다. 대신 요청 ID 로 같은 값을 가진 앱 스팬을 TraceQL 로 찾는다.
apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: ${LOKI_URL}
    isDefault: true
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - name: trace_id
          matcherType: label
          matcherRegex: trace_id
          datasourceUid: tempo
          url: "$${__value.raw}"
          urlDisplayLabel: Tempo
        - name: CloudFront 요청
          matcherType: label
          matcherRegex: aws_cloudfront_request_id
          datasourceUid: tempo
          url: '{ span."http.request.header.x-amz-cf-id" = "$${__value.raw}" }'
          urlDisplayLabel: 앱 트레이스
        - name: ALB 요청
          matcherType: label
          matcherRegex: aws_xray_trace_id
          datasourceUid: tempo
          url: '{ span."http.request.header.x-amzn-trace-id" = "$${__value.raw}" }'
          urlDisplayLabel: 앱 트레이스
