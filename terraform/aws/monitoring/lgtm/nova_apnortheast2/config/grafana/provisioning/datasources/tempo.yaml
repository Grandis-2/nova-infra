# Grafana 데이터소스 — Tempo. TEMPO_URL 은 Grafana 컨테이너 환경 변수다. obs 태스크 안에서는 http://localhost:3200
#
# 트레이스 → 로그: 스팬에서 같은 trace_id 의 로그로 간다. 로그의 trace_id 는 Loki 의 structured metadata 다(라벨이 아니다).
# 같은 서비스의 스트림만 읽도록 service_name 으로 먼저 좁힌다.
#
# 트레이스 → 프로파일: 스팬에서 그 스팬이 도는 동안의 CPU 플레임 그래프로 간다(NV-540). 앱의 확장이 프로파일 샘플에 스팬 ID 를 붙인다.
# 스팬의 service.name 을 Pyroscope 의 service_name 라벨로 맞춘다. 프로파일을 켠 서비스(service.yml 의 profiling: true)에만 데이터가 있다.
#
# 서비스 그래프: Explore 의 Service Graph 탭 · 노드 그래프는 Mimir 의 traces_service_graph_* 와 traces_spanmetrics_* 를 읽는다.
# 두 지표는 Collector 가 샘플링 전 모든 스팬으로 만든다(collector.yaml 의 servicegraph · spanmetrics).
apiVersion: 1

datasources:
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: ${TEMPO_URL}
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        customQuery: true
        query: '{service_name="$${__span.tags["service.name"]}"} | trace_id="$${__trace.traceId}"'
      tracesToProfiles:
        datasourceUid: pyroscope
        profileTypeId: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
        tags:
          - key: service.name
            value: service_name
      lokiSearch:
        datasourceUid: loki
      nodeGraph:
        enabled: true
      serviceMap:
        datasourceUid: mimir
