# Grafana 관리 경보 규칙. 알림은 notify.yaml(SNS → Chatbot → Slack)로 간다.
# 질의는 Mimir(PromQL)다. 지표 이름 · 라벨은 ../../../README.md "지표" 와 대시보드(grafana/dashboards/**/*.json)와 같다.
# 트래픽이 없어 질의가 비면(NoData) 정상으로 본다. 질의가 실패하면 Error 상태 경보가 따로 간다.
# summary 는 Grafana 템플릿이다. 달러 기호를 쓰지 않고 .Values · .Labels 로 쓴다.
# .Values 에는 쿼리(A)가 아니라 식(reduce · threshold)만 들어간다. 그래서 A → B(reduce: last) → C(threshold) 로 두고 B 를 찍는다.
# 이 파일은 프로비저닝 때 환경 변수로 펼쳐진다. 달러 변수는 빈 값이 되고, 두 번 써서 막으면 그대로 남아 템플릿이 깨진다(운영에서 확인).
apiVersion: 1

groups:
  - orgId: 1
    name: nova
    folder: nova
    interval: 1m
    rules:
      - uid: nova-http-p99
        title: HTTP P99 응답 시간
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "10분 동안 P99 가 2초를 넘었다 — 값 {{ with .Values.B }}{{ humanizeDuration .Value }}{{ end }}"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#http-p99-응답-시간"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "histogram_quantile(0.99, sum by (le, job) (rate(http_server_request_duration_seconds_bucket{service_namespace=\"nova\"}[5m])))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [2]}
      - uid: nova-jvm-heap
        title: JVM 힙 사용률
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "10분 동안 힙이 한도의 90% 를 넘었다(태스크 {{ .Labels.instance }}) — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#jvm-힙-사용률"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "sum by (job, instance) (jvm_memory_used_bytes{service_namespace=\"nova\", jvm_memory_type=\"heap\"}) / sum by (job, instance) (jvm_memory_limit_bytes{service_namespace=\"nova\", jvm_memory_type=\"heap\"} > 0)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.9]}
      - uid: nova-service-silent
        title: 서비스 지표 끊김
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "지난 1시간 안에 지표를 보내던 서비스가 5분 넘게 아무것도 보내지 않는다 — 태스크가 죽었거나 obs 로 보내지 못한다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#서비스-지표-끊김"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "count by (job) (last_over_time(target_info{job=~\"nova/.+\"}[1h])) unless count by (job) (target_info{job=~\"nova/.+\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: obs-ingest-errors
        title: obs 수집 실패
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Collector 가 받기를 거부하거나 저장소로 보내지 못한다(메모리 한도 · Loki/Tempo/Mimir 오류). 로그 · 트레이스 · 지표가 빠지고 있다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#obs-수집-실패"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 지표 이름을 정규식으로 묶어 rate 하면 이름 라벨이 빠져 라벨이 같은 시계열이 겹치고
              # Mimir 가 "vector cannot contain metrics with the same labelset" 로 실패한다(운영에서 DatasourceError).
              # 그래서 카운터마다 rate 를 따로 하고 counter 라벨을 붙여 or 로 합친다
              expr: "sum by (job) (label_replace(rate(otelcol_exporter_send_failed_log_records_total[5m]), \"counter\", \"exporter_send_failed_log_records\", \"\", \"\") or label_replace(rate(otelcol_exporter_send_failed_spans_total[5m]), \"counter\", \"exporter_send_failed_spans\", \"\", \"\") or label_replace(rate(otelcol_exporter_send_failed_metric_points_total[5m]), \"counter\", \"exporter_send_failed_metric_points\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_log_records_total[5m]), \"counter\", \"receiver_refused_log_records\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_spans_total[5m]), \"counter\", \"receiver_refused_spans\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_metric_points_total[5m]), \"counter\", \"receiver_refused_metric_points\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_log_records_total[5m]), \"counter\", \"receiver_failed_log_records\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_spans_total[5m]), \"counter\", \"receiver_failed_spans\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_metric_points_total[5m]), \"counter\", \"receiver_failed_metric_points\", \"\", \"\"))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: mysql-down
        title: MySQL 수집 끊김
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "MySQL 지표가 들어오지 않는다 — exporter 가 DB 에 붙지 못하거나(DB 중단 · 네트워크 · 계정) exporter 컨테이너가 응답하지 않는다. MySQL 대시보드 지표도 멈춘다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#mysql-수집-끊김"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # exporter 가 멈추면 mysql_up 이 사라지고 Collector 의 up 이 0 이 된다. 둘 중 있는 값을 본다.
              # exporter 를 띄우지 않는 환경에는 mysqld 수집 대상이 없어 둘 다 비고, NoData 는 정상으로 본다
              expr: "min by (job) (mysql_up{job=\"mysqld\"} or up{job=\"mysqld\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
      - uid: mysql-connections
        title: MySQL 연결 사용률
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "10분 동안 연결이 max_connections 의 80% 를 넘었다 — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}. 서비스 태스크 수 × Hikari 풀을 확인한다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#mysql-연결-사용률"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "mysql_global_status_threads_connected{job=\"mysqld\"} / mysql_global_variables_max_connections{job=\"mysqld\"}"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.8]}
      - uid: obs-disk
        title: obs 디스크 사용률
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "obs 호스트 {{ .Labels.mountpoint }} 가 80% 를 넘었다 — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}. 가득 차면 Loki · Tempo · Mimir 가 쓰기를 못 한다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#obs-디스크-사용률"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "max by (mountpoint) (system_filesystem_utilization_ratio{job=\"obs-host\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.8]}
      - uid: obs-storage-rejects
        title: obs 저장소 거부
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ .Labels.job }} 가 받은 데이터를 버리고 있다(이유 {{ .Labels.reason }}). LGTM 스택 대시보드의 '저장소가 버린 데이터'"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#obs-저장소-거부"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "sum by (job, reason) (rate(loki_discarded_samples_total[5m])) or sum by (job, reason) (rate(tempo_discarded_spans_total[5m])) or sum by (job, reason) (rate(cortex_discarded_samples_total[5m]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: mysql-long-query
        title: MySQL 오래 도는 쿼리
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ .Labels.state }} 상태 쿼리들의 실행 시간 합이 1분을 넘었다(한 쿼리가 오래 돌거나 여럿이 같은 상태에 몰림) — 값 {{ with .Values.B }}{{ humanizeDuration .Value }}{{ end }}. MySQL 대시보드의 쿼리 상태별 스레드 · 상위 SQL 을 본다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#mysql-오래-도는-쿼리"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 상태별로 그 상태에 있는 쿼리들이 머문 시간의 합이다. RDS(obs_mysql_platform = rds)에서만 나온다
              expr: "max by (state) (mysql_info_schema_processlist_seconds{job=\"mysqld\", command=\"query\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [60]}

# 파일에서 규칙을 빼도 Grafana 는 지우지 않는다. 지울 규칙은 여기 적는다.
#   nova-http-5xx(5분 5xx 5%) — SLO 가용성 소진 속도 경보(slo.yaml)로 대신한다(NV-541)
deleteRules:
  - orgId: 1
    uid: nova-http-5xx
