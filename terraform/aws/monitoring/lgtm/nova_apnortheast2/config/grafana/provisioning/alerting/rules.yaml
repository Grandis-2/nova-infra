# Grafana 관리 경보 규칙. nova 그룹 등은 notify.yaml(SNS → Chatbot → Slack)로, admin-alert 그룹은 관리자 알림 주제(→ member 허브)로 간다.
# 질의는 Mimir(PromQL)다. 프런트 경보 둘은 Loki(LogQL)다. 지표 이름 · 라벨은 ../../../README.md "지표" 와 대시보드(grafana/dashboards/**/*.json)와 같다.
# 질의가 비거나(NoData) 실패할 때의 처리는 그룹마다 다르다. nova 그룹은 비면 정상으로 보고 실패하면 Error 상태 경보가 따로 간다. admin-alert 는 그 그룹의 머리 설명을 본다.
# summary 는 Grafana 템플릿이다. 달러 기호를 쓰지 않고 .Values · .Labels 로 쓴다.
# .Values 에는 쿼리(A)가 아니라 식(reduce · threshold)만 들어간다. 그래서 A → B(reduce: last) → C(threshold) 로 두고 B 를 찍는다.
# 프로비저닝은 환경 변수를 달러 변수로 펼친다(Grafana 12.4). 라벨 · 제목 · uid · for · keepFiringFor 같은 값 하나짜리 칸은 펼치고, 주석과 질의 model 은 펼치지 않는다.
# 펼치는 칸에서 달러 변수는 빈 값이 되고 두 번 쓰면 하나로 남는다. 헷갈리지 않게 어느 칸에도 달러 기호를 쓰지 않는다.
apiVersion: 1

groups:
  - orgId: 1
    name: nova
    folder: nova
    interval: 1m
    rules:
      - uid: nova-jvm-heap
        title: JVM 힙 사용률
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "10분 동안 힙이 한도의 90% 를 넘었다(태스크 {{ .Labels.instance }}) — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#jvm-힙-사용률"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "sum by (job, instance) (jvm_memory_used_bytes{service_namespace=\"nova\", jvm_memory_type=\"heap\"}) / sum by (job, instance) (jvm_memory_limit_bytes{service_namespace=\"nova\", jvm_memory_type=\"heap\"} > 0)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.9]}
      - uid: nova-service-silent
        title: 서비스 지표 끊김
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "지난 1시간 안에 지표를 보내던 서비스가 5분 넘게 아무것도 보내지 않는다 — 태스크가 죽었거나 obs 로 보내지 못한다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#서비스-지표-끊김"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "count by (job) (last_over_time(target_info{job=~\"nova/.+\"}[1h])) unless count by (job) (target_info{job=~\"nova/.+\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: nova-message-errors
        title: 메시지 처리 오류율
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ .Labels.queue }} 큐 메시지 처리의 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}가 실패했다. 실패한 메시지는 다시 처리되다가 횟수를 다 쓰면 DLQ 로 간다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#메시지-처리-오류율"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 처리 스팬 이름이 "<큐> process" 다. 10분에 6건(초당 0.01) 넘게 처리한 큐만 본다
              expr: "(sum by (queue) (label_replace(rate(traces_spanmetrics_calls_total{messaging_system!=\"\", span_name=~\".+ process\", span_kind=\"SPAN_KIND_CONSUMER\", status_code=\"STATUS_CODE_ERROR\"}[10m]), \"queue\", \"$1\", \"span_name\", \"(.+) process\")) / sum by (queue) (label_replace(rate(traces_spanmetrics_calls_total{messaging_system!=\"\", span_name=~\".+ process\", span_kind=\"SPAN_KIND_CONSUMER\"}[10m]), \"queue\", \"$1\", \"span_name\", \"(.+) process\"))) and sum by (queue) (label_replace(rate(traces_spanmetrics_calls_total{messaging_system!=\"\", span_name=~\".+ process\", span_kind=\"SPAN_KIND_CONSUMER\"}[10m]), \"queue\", \"$1\", \"span_name\", \"(.+) process\")) > 0.01"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
      - uid: nova-preorder-dead-letter
        title: 포기한 예약 동기화 작업
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "외부 예약 {{ .Labels.jobType }} 을 포기한 작업이 {{ with .Values.B }}{{ .Value }}{{ end }} 건 있다 — 관리자 재처리나 수동 완료가 필요하다. 취소면 외부에 예약이 남아 있을 수 있다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#포기한-예약-동기화-작업"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # preorder 가 작업 DLQ 메시지를 바로 가져가 DEAD_LETTER 로 바꾸므로 SQS DLQ 경보(쌓인 수)로는 보이지 않는다.
              # 게이지는 태스크마다 DB 에서 30초마다 다시 센 같은 값이라 max 로 묶는다. 처리하면 0 으로 내려가 풀린다
              expr: "max by (jobType) (preorder_sync_dead_letter)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: nova-preorder-scaling-failures
        title: 회차 증설 실패
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "preorder 가 회차 일정에 맞춰 waitingroom · preorder 최소 대수를 10분 동안 약 {{ with .Values.B }}{{ printf `%.0f` .Value }}{{ end }} 번 바꾸지 못했다 — 오픈 전이면 미리 늘리지 못한 채 몰림을 맞는다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#회차-증설-실패"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 1분마다 맞추고 실패하면 다음 주기에 다시 한다. 한두 번은 넘기고 3번 이상 실패할 때만 본다.
              # increase 는 창 경계를 외삽해 2번이 2.2 처럼 나오므로 기준을 2.5 로 둔다(반올림 없이 비교)
              expr: "sum(increase(preorder_scaling_failures_total[10m]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [2.5]}
      - uid: nova-payment-dead-letters
        title: 결제 DLQ 대기
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "payment-events 에서 처리하지 못한 메시지 {{ with .Values.B }}{{ printf `%.0f` .Value }}{{ end }} 건이 관리자 처리를 기다린다 — 환불 요청이면 그 주문은 취소 중에 멈춰 있다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#결제-dlq-대기"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # payment 가 DLQ 메시지를 DB 로 옮기므로 CloudWatch 의 payment-events-dlq 경보는 거의 울리지 않는다. 대신 DB 의 대기 건수를 본다.
              # 태스크마다 같은 DB 를 세므로 합치지 않고 가장 큰 값을 쓴다
              expr: "max(payment_dlq_waiting)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: nova-payment-refund-discarded
        title: 버린 환불 요청
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "관리자가 payment DLQ 의 환불 요청을 지난 1시간 약 {{ with .Values.B }}{{ printf `%.0f` .Value }}{{ end }} 건 버렸다 — 다시 보내는 길이 없으니 그 주문의 환불이 끝났는지 확인한다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#버린-환불-요청"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 버린 행은 대기 수(payment_dlq_waiting)에서 빠지므로 따로 본다. 한 건이라도 본다. 외삽을 감안해 기준을 0.5 로 둔다
              expr: "sum(increase(payment_dlq_discarded_total{eventType=\"ORDER_REFUND_REQUESTED\"}[1h]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.5]}
      - uid: nova-payment-recovery-attention
        title: 결제 복구 사람 확인
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "payment 복구가 {{ .Labels.type }} 거래({{ .Labels.target }})를 끝내지 못했다 — 사유 {{ .Labels.reason }}, 지난 1시간 약 {{ with .Values.B }}{{ printf `%.0f` .Value }}{{ end }} 건. 돈이 나갔거나 돌아가지 않았을 수 있다 — 결제사 기록부터 본다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#결제-복구-사람-확인"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 한 건이라도 사람이 봐야 한다. 시계열은 0 으로 미리 등록돼 첫 건도 잡히고, 1시간 창이라 그동안 경보가 이어진다.
              # increase 는 창 경계를 외삽하므로 1건이 1 보다 크거나 작게 나올 수 있어 기준을 0.5 로 둔다
              expr: "sum by (type, target, reason) (increase(payment_recovery_attention_total[1h]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.5]}
      - uid: nova-order-payment-attention
        title: 주문 결제 사람 확인
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "order 가 결제 · 환불 결과를 반영하다 사람이 봐야 하는 건을 알아챘다 — 사유 {{ .Labels.reason }}, 지난 1시간 약 {{ with .Values.B }}{{ printf `%.0f` .Value }}{{ end }} 건. 돈이 나간 채 주문이 끝났을 수 있다 — 결제사 기록부터 본다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#주문-결제-사람-확인"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 한 건이라도 사람이 봐야 한다. 사유마다 0 으로 미리 등록돼 첫 건도 잡힌다. 같은 결과를 다시 받으면 다시 세므로 건수는 알아챈 횟수다.
              # increase 는 창 경계를 외삽하므로 1건이 1 보다 크거나 작게 나올 수 있어 기준을 0.5 로 둔다
              expr: "sum by (reason) (increase(order_payment_attention_total[1h]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.5]}
      - uid: nova-frontend-errors
        title: 프런트 JS 오류 급증
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "브라우저 오류가 15분에 30건을 넘고 지난주 같은 시각의 3배를 넘었다(샘플에 든 세션 기준) — 값 {{ with .Values.B }}{{ .Value }}{{ end }}건"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#프런트-js-오류-급증"
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 900, to: 0}
            model:
              refId: A
              queryType: instant
              expr: "sum(count_over_time({service_name=\"nova-web\"} | kind=\"exception\" [15m])) > 30 and sum(count_over_time({service_name=\"nova-web\"} | kind=\"exception\" [15m])) > 3 * (sum(count_over_time({service_name=\"nova-web\"} | kind=\"exception\" [15m] offset 1w)) or vector(0))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: nova-frontend-lcp
        title: 프런트 LCP 악화
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "30분 동안 LCP p75 가 4초('나쁨' 기준)를 넘었다(측정 30건 이상일 때만) — 값 {{ with .Values.B }}{{ printf `%.0f` .Value }}ms{{ end }}"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#프런트-lcp-악화"
        data:
          - refId: A
            datasourceUid: loki
            relativeTimeRange: {from: 1800, to: 0}
            model:
              refId: A
              queryType: instant
              expr: "quantile_over_time(0.75, {service_name=\"nova-web\"} | kind=\"measurement\" |= \"type=web-vitals\" | logfmt | value_lcp!=\"\" | unwrap value_lcp | __error__=\"\" [30m]) by () > 4000 and on() sum(count_over_time({service_name=\"nova-web\"} | kind=\"measurement\" |= \"type=web-vitals\" | logfmt | value_lcp=~\"[0-9]+(\\\\.[0-9]+)?\" [30m])) >= 30"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: obs-ingest-errors
        title: obs 수집 실패
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Collector 가 받기를 거부하거나 저장소로 보내지 못한다(메모리 한도 · Loki/Tempo/Mimir 오류). 로그 · 트레이스 · 지표가 빠지고 있다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#obs-수집-실패"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 지표 이름을 정규식으로 묶어 rate 하면 이름 라벨이 빠져 라벨이 같은 시계열이 겹치고
              # Mimir 가 "vector cannot contain metrics with the same labelset" 로 실패한다(운영에서 DatasourceError).
              # 그래서 카운터마다 rate 를 따로 하고 counter 라벨을 붙여 or 로 합친다
              expr: "sum by (job) (label_replace(rate(otelcol_exporter_send_failed_log_records_total[5m]), \"counter\", \"exporter_send_failed_log_records\", \"\", \"\") or label_replace(rate(otelcol_exporter_send_failed_spans_total[5m]), \"counter\", \"exporter_send_failed_spans\", \"\", \"\") or label_replace(rate(otelcol_exporter_send_failed_metric_points_total[5m]), \"counter\", \"exporter_send_failed_metric_points\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_log_records_total[5m]), \"counter\", \"receiver_refused_log_records\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_spans_total[5m]), \"counter\", \"receiver_refused_spans\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_metric_points_total[5m]), \"counter\", \"receiver_refused_metric_points\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_log_records_total[5m]), \"counter\", \"receiver_failed_log_records\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_spans_total[5m]), \"counter\", \"receiver_failed_spans\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_metric_points_total[5m]), \"counter\", \"receiver_failed_metric_points\", \"\", \"\") or label_replace(rate(otelcol_exporter_enqueue_failed_log_records_total[5m]), \"counter\", \"exporter_enqueue_failed_log_records\", \"\", \"\") or label_replace(rate(otelcol_exporter_enqueue_failed_spans_total[5m]), \"counter\", \"exporter_enqueue_failed_spans\", \"\", \"\") or label_replace(rate(otelcol_exporter_enqueue_failed_metric_points_total[5m]), \"counter\", \"exporter_enqueue_failed_metric_points\", \"\", \"\"))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: mysql-down
        title: MySQL 수집 끊김
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "MySQL 지표가 들어오지 않는다 — exporter 가 DB 에 붙지 못하거나(DB 중단 · 네트워크 · 계정) exporter 컨테이너가 응답하지 않는다. MySQL 대시보드 지표도 멈춘다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#mysql-수집-끊김"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # exporter 가 멈추면 mysql_up 이 사라지고 Collector 의 up 이 0 이 된다. 둘 중 있는 값을 본다.
              # exporter 를 띄우지 않는 환경에는 mysqld 수집 대상이 없어 둘 다 비고, NoData 는 정상으로 본다
              expr: "min by (job) (mysql_up{job=\"mysqld\"} or up{job=\"mysqld\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
      - uid: mysql-connections
        title: MySQL 연결 사용률
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "10분 동안 연결이 max_connections 의 80% 를 넘었다 — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}. 서비스 태스크 수 × Hikari 풀을 확인한다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#mysql-연결-사용률"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "mysql_global_status_threads_connected{job=\"mysqld\"} / mysql_global_variables_max_connections{job=\"mysqld\"}"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.8]}
      - uid: obs-disk
        title: obs 디스크 사용률
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "obs 호스트 {{ .Labels.mountpoint }} 가 80% 를 넘었다 — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}. 가득 차면 Loki · Tempo · Mimir 가 쓰기를 못 한다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#obs-디스크-사용률"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "max by (mountpoint) (system_filesystem_utilization_ratio{job=\"obs-host\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.8]}
      - uid: obs-storage-rejects
        title: obs 저장소 거부
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ .Labels.job }} 가 받은 데이터를 버리고 있다(이유 {{ .Labels.reason }}). LGTM 스택 대시보드의 '저장소가 버린 데이터'"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#obs-저장소-거부"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "sum by (job, reason) (rate(loki_discarded_samples_total[5m])) or sum by (job, reason) (rate(tempo_discarded_spans_total[5m])) or sum by (job, reason) (rate(cortex_discarded_samples_total[5m]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: mysql-long-query
        title: MySQL 오래 도는 쿼리
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ .Labels.state }} 상태 쿼리들의 실행 시간 합이 1분을 넘었다(한 쿼리가 오래 돌거나 여럿이 같은 상태에 몰림) — 값 {{ with .Values.B }}{{ humanizeDuration .Value }}{{ end }}. MySQL 대시보드의 쿼리 상태별 스레드 · 상위 SQL 을 본다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#mysql-오래-도는-쿼리"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 상태별로 그 상태에 있는 쿼리들이 머문 시간의 합이다.
              expr: "max by (state) (mysql_info_schema_processlist_seconds{job=\"mysqld\", command=\"query\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [60]}
      - uid: obs-cardinality-limit
        title: obs 저장 한도 근접
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "{{ .Labels.store }} 가 한도의 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }} 를 쓰고 있다. 한도에 닿으면 새 시계열 · 스트림을 버린다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#obs-저장-한도-근접"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 나누는 수는 mimir.yaml 의 max_global_series_per_user · loki.yaml 의 max_global_streams_per_user 다(둘을 같이 바꾼다).
              # 저장소는 테넌트 한도를 지표로 내지 않아 숫자로 적는다
              expr: "label_replace(sum(cortex_ingester_memory_series) / 150000, \"store\", \"Mimir 활성 시계열\", \"\", \"\") or label_replace(sum(loki_ingester_memory_streams) / 5000, \"store\", \"Loki 스트림\", \"\", \"\")"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.7]}
      - uid: obs-loki-volume-spike
        title: Loki 수집량 급증
        condition: C
        for: 30m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "최근 1시간 로그 수집량이 지난주 같은 시각의 {{ with .Values.B }}{{ humanize .Value }}{{ end }} 배다. 저장 비용 · 수집 한도(4 MB/s)를 먹는다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#loki-수집량-급증"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 지난주 값이 없으면(처음 1주) 결과가 비어 울리지 않는다. 초당 10 KiB 아래는 보지 않는다(작은 값끼리의 배수는 뜻이 없다)
              expr: "sum(rate(loki_distributor_bytes_received_total[1h])) / sum(rate(loki_distributor_bytes_received_total[1h] offset 1w)) and sum(rate(loki_distributor_bytes_received_total[1h])) > 10240"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [3]}
      - uid: spanmetrics-overflow
        title: APM 지표 라벨 조합 넘침
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "span metrics 의 라벨 조합이 상한(2000)을 넘어 넘친 것은 otel_metric_overflow 시계열 하나로 합쳐지고 있다. 서비스 상세의 시간 구성 · 엔드포인트 표가 틀어진다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#apm-지표-라벨-조합-넘침"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 상한은 게이트웨이 설정(gateway/collector.yaml) spanmetrics 의 aggregation_cardinality_limit 이다
              expr: "count(traces_spanmetrics_calls_total{otel_metric_overflow=\"true\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: otel-gateway-queue
        title: 게이트웨이 전송 큐 적체
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "게이트웨이 {{ .Labels.exporter }} 의 전송 큐가 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }} 찼다. 저장소가 받지 못하는 중이다. 가득 차면 새 데이터를 버린다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#게이트웨이-전송-큐-적체"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # obs 재배포(몇 분)는 for 10m 안에 끝나 울리지 않는다
              expr: "max by (exporter) (otelcol_exporter_queue_size{job=\"otel-gateway\"} / otelcol_exporter_queue_capacity{job=\"otel-gateway\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.5]}
  # 관리자 알림 (NV-825). admin_alert_type 이 붙은 규칙은 notify.yaml 이 관리자 알림 주제(→ admin-alert-grafana 큐 → member 허브)로 보낸다.
  # 라벨 · 주석 · 메시지 모양은 be contracts/admin-alert-grafana.md 가 정한다. 값은 주석 metric_* 으로 싣는다(허브는 빈 값 · NaN 을 null 로 읽는다).
  # 허브는 type · 대상마다 알림 인스턴스가 하나라고 본다. 결과에 인스턴스 라벨이 남지 않게 끝을 max · min · sum 이나 by (job) 으로 묶는다.
  # 해소는 keepFiringFor 만큼 기준 아래로 머문 뒤에 간다. 질의가 실패하면 앞 상태를 둔다(KeepLast) — 실패를 해소로 보내 허브의 알림이 끊기지 않게.
  # NoData: 게이지 규칙 6종은 데이터가 잠깐 비어도 앞 상태를 둔다(KeepLast) — 해소됐다 새 사건으로 다시 열려 읽음이 풀리지 않게. 지표가 아예 사라지면 '서비스 지표 끊김'이 Slack 으로 간다.
  #   요청량 기반인 SERVICE_* 2종은 요청이 없으면 정상이다(OK).
  # 데이터소스 질의가 하나라도 비면 평가 전체가 NoData 가 된다. 그래서 라벨 없는 규칙의 값 주석용 질의는 or vector(NaN) 으로 끝낸다(허브는 NaN 을 null 로 읽는다).
  # Slack 에도 보내는 것만 severity: critical 을 단다. 지표는 60초마다 들어오므로 비율 창은 샘플이 둘 들어가는 2분이고, 2분 증가량은 그 둘로 외삽한 값이다.
  - orgId: 1
    name: admin-alert
    folder: nova
    interval: 1m
    rules:
      - uid: admin-register-failed
        title: "관리자 알림: 재처리가 필요한 예약"
        condition: C
        for: 0s
        keepFiringFor: 1m
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          admin_alert_type: REGISTER_FAILED
          admin_alert_target_kind: NONE
        annotations:
          summary: "외부 예약 등록을 포기한 작업이 있다 — 관리자 재처리가 필요하다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_deadLetters: '{{ with .Values.B }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 게이지는 태스크마다 같은 값이라 max 로 묶는다(nova-preorder-dead-letter 와 같은 지표)
              expr: "max(preorder_sync_dead_letter{jobType=\"REGISTER\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: admin-event-dlq-waiting
        title: "관리자 알림: 예약에 반영 안 된 이벤트"
        condition: C
        for: 0s
        keepFiringFor: 1m
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          admin_alert_type: EVENT_DLQ_WAITING
          admin_alert_target_kind: NONE
        annotations:
          summary: "preorder 이벤트 DLQ 에 처리를 기다리는 메시지가 있다 — 결제 · 만료가 예약에 반영되지 않았다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_waiting: '{{ with .Values.B }}{{ .Value }}{{ end }}'
          metric_oldestAgeSeconds: '{{ with .Values.E }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              expr: "max(preorder_dlq_waiting)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
          - refId: D
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: D
              instant: true
              expr: "max(preorder_dlq_waiting_oldest_age_seconds) or vector(NaN)"
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
      - uid: admin-queue-braking
        title: "관리자 알림: 서버 부하로 입장을 줄이는 중"
        condition: C
        for: 0s
        keepFiringFor: 1m
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          admin_alert_type: QUEUE_BRAKING
          admin_alert_target_kind: NONE
          severity: critical
        annotations:
          summary: "waitingroom 이 preorder 의 나쁜 응답 때문에 입장 속도에 브레이크를 걸었다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_brakeFactor: '{{ with .Values.B }}{{ .Value }}{{ end }}'
          metric_preorderBadRatio: '{{ with .Values.E }}{{ .Value }}{{ end }}'
          metric_preorderP95Seconds: '{{ with .Values.G }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 판정 재료가 없으면 NaN 이라 비교가 거짓이다. 원인 값은 브레이크 입력과 같은 waitingroom → preorder 호출 지표다
              # preorderBadRatio 는 5xx · 오류(상태 코드 없음 = 연결 오류)만 센다. 브레이크가 함께 세는 2초 넘는 느린 응답은 preorderP95Seconds 로 본다
              expr: "min(waitingroom_brake_factor)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
          - refId: D
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: D
              instant: true
              expr: "(sum(rate(http_client_request_duration_seconds_count{job=\"nova/waitingroom\", server_address=~\"preorder.*\", http_response_status_code=~\"5..|\"}[2m])) / sum(rate(http_client_request_duration_seconds_count{job=\"nova/waitingroom\", server_address=~\"preorder.*\"}[2m]))) or vector(NaN)"
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
          - refId: F
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: F
              instant: true
              expr: "histogram_quantile(0.95, sum by (le) (rate(http_client_request_duration_seconds_bucket{job=\"nova/waitingroom\", server_address=~\"preorder.*\"}[2m]))) or vector(NaN)"
          - refId: G
            datasourceUid: __expr__
            model:
              refId: G
              type: reduce
              reducer: last
              expression: F
      - uid: admin-queue-server-unhealthy
        title: "관리자 알림: 대기열 서버 점검 필요"
        condition: C
        for: 1m
        keepFiringFor: 1m
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          admin_alert_type: QUEUE_SERVER_UNHEALTHY
          admin_alert_target_kind: NONE
        annotations:
          summary: "대기열의 판정 재료가 오래됐거나 리더 · 게이트웨이가 없다 — 새로 오는 사람을 모두 줄 세운다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_snapshotAgeSeconds: '{{ with .Values.E }}{{ .Value }}{{ end }}'
          metric_leaders: '{{ with .Values.G }}{{ .Value }}{{ end }}'
          metric_gateways: '{{ with .Values.I }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 재료가 5초 넘게 묵음 · 재료 없음(음수) · 리더 없음 · 게이트웨이 0 중 하나면 1. 늘 0 이나 1 이다
              # 재료 나이 · 게이트웨이 항은 지표가 없으면 0(그 항으로는 판정하지 않음), 리더 항은 1 이다 — waitingroom 지표가 5분(조회 lookback) 넘게 없으면 서비스가 내려간 것이라 리더 없음으로 본다
              # 5분 넘게 이어질 때의 긴급 승격은 허브가 startsAt 으로 한다
              expr: "clamp_max(((max(waitingroom_snapshot_age_seconds) > bool 5) or vector(0)) + ((max(waitingroom_snapshot_age_seconds) < bool 0) or vector(0)) + ((sum(waitingroom_leader) == bool 0) or vector(1)) + ((max(waitingroom_gateways) == bool 0) or vector(0)), 1)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
          - refId: D
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: D
              instant: true
              expr: "max(waitingroom_snapshot_age_seconds) or vector(NaN)"
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
          - refId: F
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: F
              instant: true
              expr: "sum(waitingroom_leader) or vector(NaN)"
          - refId: G
            datasourceUid: __expr__
            model:
              refId: G
              type: reduce
              reducer: last
              expression: F
          - refId: H
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: H
              instant: true
              expr: "max(waitingroom_gateways) or vector(NaN)"
          - refId: I
            datasourceUid: __expr__
            model:
              refId: I
              type: reduce
              reducer: last
              expression: H
      - uid: admin-external-system-down
        title: "관리자 알림: 외부 예약 시스템 응답 실패"
        condition: C
        for: 0s
        keepFiringFor: 1m
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          admin_alert_type: EXTERNAL_SYSTEM_DOWN
          admin_alert_target_kind: NONE
        annotations:
          summary: "worker 의 외부 mock 차단기가 열렸다 — 외부 예약 등록 · 취소가 잠시 멈춘다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_openWorkers: '{{ with .Values.B }}{{ .Value }}{{ end }}'
          metric_mockFailureRatio: '{{ with .Values.E }}{{ .Value }}{{ end }}'
          metric_mockCalls: '{{ with .Values.G }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 차단기는 worker 마다 따로 판단한다. 열림 · 반쯤 열림인 worker 수다. 닫혀야(회복) 0 이 된다
              expr: "sum(resilience4j_circuitbreaker_state{job=\"nova/worker\", name=\"mock\", state=~\"open|half_open|forced_open\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
          - refId: D
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: D
              instant: true
              expr: "sum(rate(worker_mock_calls_total{verdict=~\"TRANSIENT|UNKNOWN\"}[2m])) / sum(rate(worker_mock_calls_total[2m])) or vector(NaN)"
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
          - refId: F
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: F
              instant: true
              expr: "sum(increase(worker_mock_calls_total[2m])) or vector(NaN)"
          - refId: G
            datasourceUid: __expr__
            model:
              refId: G
              type: reduce
              reducer: last
              expression: F
      - uid: admin-service-incident
        title: "관리자 알림: 서비스 장애"
        condition: C
        for: 0s
        keepFiringFor: 5m
        missing_series_evals_to_resolve: 5
        noDataState: OK
        execErrState: KeepLast
        labels:
          admin_alert_type: SERVICE_INCIDENT
          admin_alert_target_kind: SERVICE
          admin_alert_target_id: '{{ reReplaceAll "^nova/" "" .Labels.job }}'
        annotations:
          summary: "서비스가 5분 내내 5xx 를 5% 넘게 냈거나 결제 · 예약 접수에서 5xx 를 냈다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_errorRatio: '{{ with .Values.B }}{{ .Value }}{{ end }}'
          metric_errors: '{{ with .Values.G }}{{ .Value }}{{ end }}'
          metric_requests: '{{ with .Values.I }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 900, to: 0}
            model:
              refId: A
              instant: true
              # 오류 급증(아래 규칙과 같은 식)이 1분 간격 다섯 점 모두 있고 모두 5% 를 넘었거나(하한 아래로 빠진 분이 있으면 판정하지 않는다),
              # 결제 승인 · 예약 접수 경로가 2분에 받은 요청(5xx 만이 아니라 전체, 외삽값)이 5건 이상이고 그중 5xx 가 5% 를 넘었다
              # 울리던 job 의 시계열이 빠질 때: 결과 전체가 비면 NoData(OK)가 되고 해소는 keepFiringFor 5m 이 미룬다.
              # 다른 job 이 남아 결과가 비지 않으면 빠진 job 은 missing_series_evals_to_resolve(5번 평가) 뒤에 풀린다
              # metric_errorRatio 는 울린 값(B)이다 — 1분 간격 다섯 점의 2분 비율 중 최솟값, 또는 핵심 경로의 2분 비율. errors · requests 는 5분 증가량이다
              expr: "(min_over_time((sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_response_status_code=~\"5..\"}[2m])) / sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[2m])) and on (job) sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[2m])) >= 0.1666)[5m:1m]) > 0.05 and on (job) count_over_time((sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_response_status_code=~\"5..\"}[2m])) / sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[2m])) and on (job) sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[2m])) >= 0.1666)[5m:1m]) >= 5) or (sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_request_method=\"POST\", http_route=~\"/api/v1/preorders|/api/v1/orders/.+/payment-attempts/.+/confirm|/api/v1/draws/.+/entries/me/payment-attempts/.+/confirm\", http_response_status_code=~\"5..\"}[2m])) / sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_request_method=\"POST\", http_route=~\"/api/v1/preorders|/api/v1/orders/.+/payment-attempts/.+/confirm|/api/v1/draws/.+/entries/me/payment-attempts/.+/confirm\"}[2m])) > 0.05 and on (job) sum by (job) (increase(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_request_method=\"POST\", http_route=~\"/api/v1/preorders|/api/v1/orders/.+/payment-attempts/.+/confirm|/api/v1/draws/.+/entries/me/payment-attempts/.+/confirm\"}[2m])) >= 5)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
          - refId: F
            datasourceUid: mimir
            relativeTimeRange: {from: 900, to: 0}
            model:
              refId: F
              instant: true
              expr: "sum by (job) (increase(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_response_status_code=~\"5..\"}[5m]))"
          - refId: G
            datasourceUid: __expr__
            model:
              refId: G
              type: reduce
              reducer: last
              expression: F
          - refId: H
            datasourceUid: mimir
            relativeTimeRange: {from: 900, to: 0}
            model:
              refId: H
              instant: true
              expr: "sum by (job) (increase(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[5m]))"
          - refId: I
            datasourceUid: __expr__
            model:
              refId: I
              type: reduce
              reducer: last
              expression: H
      - uid: admin-service-error-spike
        title: "관리자 알림: 서비스 오류 급증"
        condition: C
        for: 0s
        keepFiringFor: 1m
        noDataState: OK
        execErrState: KeepLast
        labels:
          admin_alert_type: SERVICE_ERROR_SPIKE
          admin_alert_target_kind: SERVICE
          admin_alert_target_id: '{{ reReplaceAll "^nova/" "" .Labels.job }}'
        annotations:
          summary: "서비스의 5xx 비율이 2분 동안 5% 를 넘었다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_errorRatio: '{{ with .Values.B }}{{ .Value }}{{ end }}'
          metric_errors: '{{ with .Values.G }}{{ .Value }}{{ end }}'
          metric_requests: '{{ with .Values.I }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 분당 10건(초당 0.1666) 넘게 받는 서비스만 본다(slo.yaml 의 하한과 같다). 몇 건의 5xx 로 울리지 않게
              expr: "sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_response_status_code=~\"5..\"}[2m])) / sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[2m])) and on (job) sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[2m])) >= 0.1666"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
          - refId: F
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: F
              instant: true
              expr: "sum by (job) (increase(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\", http_response_status_code=~\"5..\"}[2m]))"
          - refId: G
            datasourceUid: __expr__
            model:
              refId: G
              type: reduce
              reducer: last
              expression: F
          - refId: H
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: H
              instant: true
              expr: "sum by (job) (increase(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_route!~\"/actuator.*\"}[2m]))"
          - refId: I
            datasourceUid: __expr__
            model:
              refId: I
              type: reduce
              reducer: last
              expression: H
      - uid: admin-shipping-backlog
        title: "관리자 알림: 배송 처리 대기 쌓임"
        condition: C
        for: 1m
        keepFiringFor: 1m
        noDataState: KeepLast
        execErrState: KeepLast
        labels:
          admin_alert_type: SHIPPING_BACKLOG
          admin_alert_target_kind: NONE
        annotations:
          summary: "상품 준비 · 출고 대기 주문이 50건 이상이다"
          runbook_url: "https://github.com/Grandis-2/nova-infra/blob/main/terraform/aws/monitoring/lgtm/nova_apnortheast2/config/README.md#관리자-알림"
          metric_total: '{{ with .Values.B }}{{ .Value }}{{ end }}'
          metric_preparingItems: '{{ with .Values.E }}{{ .Value }}{{ end }}'
          metric_readyToShip: '{{ with .Values.G }}{{ .Value }}{{ end }}'
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: A
              instant: true
              # 인스턴스마다 같은 값이라 상태별 max 를 더한다(contracts/admin-alert-events.md). 첫 갱신 전 NaN 은 비교가 거짓이다
              expr: "sum(max by (status) (order_status_count))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [49]}
          - refId: D
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: D
              instant: true
              expr: "max(order_status_count{status=\"PREPARING_ITEMS\"}) or vector(NaN)"
          - refId: E
            datasourceUid: __expr__
            model:
              refId: E
              type: reduce
              reducer: last
              expression: D
          - refId: F
            datasourceUid: mimir
            relativeTimeRange: {from: 600, to: 0}
            model:
              refId: F
              instant: true
              expr: "max(order_status_count{status=\"READY_TO_SHIP\"}) or vector(NaN)"
          - refId: G
            datasourceUid: __expr__
            model:
              refId: G
              type: reduce
              reducer: last
              expression: F

# 파일에서 규칙을 빼도 Grafana 는 지우지 않는다. 지울 규칙은 여기 적는다.
#   nova-http-5xx(5분 5xx 5%) — SLO 가용성 소진 속도 경보(slo.yaml)로 대신한다(NV-541)
#   nova-http-p99(P99 2초) — 저트래픽에서 몇 건으로 울렸다. 응답 시간 SLO 소진 속도 · 평소 대비 급증 경보로 대신한다(NV-774)
deleteRules:
  - orgId: 1
    uid: nova-http-5xx
  - orgId: 1
    uid: nova-http-p99
