# Grafana 관리 경보 규칙. 알림은 notify.yaml(SNS → Chatbot → Slack)로 간다.
# 질의는 Mimir(PromQL)다. 지표 이름 · 라벨은 ../../../README.md "지표" 와 대시보드(gen.sh)와 같다.
# 트래픽이 없어 질의가 비면(NoData) 정상으로 본다. 질의가 실패하면 Error 상태 경보가 따로 간다.
# summary 는 Grafana 템플릿이다. 달러 기호를 쓰지 않고 .Values · .Labels 로 쓴다.
# .Values 에는 쿼리(A)가 아니라 식(reduce · threshold)만 들어간다. 그래서 A → B(reduce: last) → C(threshold) 로 두고 B 를 찍는다.
# 이 파일은 프로비저닝 때 환경 변수로 펼쳐진다. 달러 변수는 빈 값이 되고, 두 번 써서 막으면 그대로 남아 템플릿이 깨진다(운영에서 확인).
apiVersion: 1

groups:
  - orgId: 1
    name: nova
    folder: nova
    interval: 1m
    rules:
      - uid: nova-http-5xx
        title: HTTP 5xx 비율
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "5분 동안 5xx 응답이 5% 를 넘었다 — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\", http_response_status_code=~\"5..\"}[5m])) / sum by (job) (rate(http_server_request_duration_seconds_count{service_namespace=\"nova\"}[5m]))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
      - uid: nova-http-p99
        title: HTTP P99 응답 시간
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "10분 동안 P99 가 2초를 넘었다 — 값 {{ with .Values.B }}{{ humanizeDuration .Value }}{{ end }}"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "histogram_quantile(0.99, sum by (le, job) (rate(http_server_request_duration_seconds_bucket{service_namespace=\"nova\"}[5m])))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [2]}
      - uid: nova-jvm-heap
        title: JVM 힙 사용률
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "10분 동안 힙이 한도의 90% 를 넘었다(태스크 {{ .Labels.instance }}) — 값 {{ with .Values.B }}{{ humanizePercentage .Value }}{{ end }}"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "sum by (job, instance) (jvm_memory_used_bytes{service_namespace=\"nova\", jvm_memory_type=\"heap\"}) / sum by (job, instance) (jvm_memory_limit_bytes{service_namespace=\"nova\", jvm_memory_type=\"heap\"} > 0)"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.9]}
      - uid: nova-service-silent
        title: 서비스 지표 끊김
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "지난 1시간 안에 지표를 보내던 서비스가 5분 넘게 아무것도 보내지 않는다 — 태스크가 죽었거나 obs 로 보내지 못한다"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              expr: "count by (job) (last_over_time(target_info{service_namespace=\"nova\"}[1h])) unless count by (job) (target_info{service_namespace=\"nova\"})"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
      - uid: obs-ingest-errors
        title: obs 수집 실패
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "Collector 가 받기를 거부하거나 저장소로 보내지 못한다(메모리 한도 · Loki/Tempo/Mimir 오류). 로그 · 트레이스 · 지표가 빠지고 있다"
        data:
          - refId: A
            datasourceUid: mimir
            relativeTimeRange: {from: 3600, to: 0}
            model:
              refId: A
              instant: true
              # 지표 이름을 정규식으로 묶어 rate 하면 이름 라벨이 빠져 라벨이 같은 시계열이 겹치고
              # Mimir 가 "vector cannot contain metrics with the same labelset" 로 실패한다(운영에서 DatasourceError).
              # 그래서 카운터마다 rate 를 따로 하고 counter 라벨을 붙여 or 로 합친다
              expr: "sum by (job) (label_replace(rate(otelcol_exporter_send_failed_log_records_total[5m]), \"counter\", \"exporter_send_failed_log_records\", \"\", \"\") or label_replace(rate(otelcol_exporter_send_failed_spans_total[5m]), \"counter\", \"exporter_send_failed_spans\", \"\", \"\") or label_replace(rate(otelcol_exporter_send_failed_metric_points_total[5m]), \"counter\", \"exporter_send_failed_metric_points\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_log_records_total[5m]), \"counter\", \"receiver_refused_log_records\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_spans_total[5m]), \"counter\", \"receiver_refused_spans\", \"\", \"\") or label_replace(rate(otelcol_receiver_refused_metric_points_total[5m]), \"counter\", \"receiver_refused_metric_points\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_log_records_total[5m]), \"counter\", \"receiver_failed_log_records\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_spans_total[5m]), \"counter\", \"receiver_failed_spans\", \"\", \"\") or label_replace(rate(otelcol_receiver_failed_metric_points_total[5m]), \"counter\", \"receiver_failed_metric_points\", \"\", \"\"))"
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              reducer: last
              expression: A
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
