# 서비스별 대시보드를 파일에서 읽는다(grafana/dashboards/*.json, gen.sh 가 만든다).
# 화면에서 고쳐도 저장되지 않는다 — 고칠 때는 gen.sh 의 틀을 고치고 다시 만든다.
apiVersion: 1

providers:
  - name: nova
    folder: nova
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /config/grafana/dashboards
      foldersFromFilesStructure: false
