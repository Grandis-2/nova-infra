# 서비스별 대시보드를 파일에서 읽는다(grafana/dashboards/*.json).
# 화면에서 고쳐도 저장되지 않는다 — 고칠 때는 JSON 파일을 고친다(8개가 같은 틀).
apiVersion: 1

providers:
  - name: nova
    folder: nova
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /config/grafana/dashboards
      foldersFromFilesStructure: false
