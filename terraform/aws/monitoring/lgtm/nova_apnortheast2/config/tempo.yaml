# 단일 바이너리 Tempo. 블록은 S3, 아직 블록이 되지 않은 스팬(WAL)은 로컬 디스크(/var/tempo).
# -config.expand-env=true 로 띄운다. 값은 ECS 작업 정의가 넘긴다:
#   TEMPO_S3_BUCKET · TEMPO_S3_REGION · TEMPO_RETENTION (필수)
#   TEMPO_S3_ENDPOINT · TEMPO_S3_FORCE_PATH_STYLE · TEMPO_S3_INSECURE (로컬 S3 대체용. 실제 AWS 에서는 넘기지 않는다.
#     TEMPO_S3_ENDPOINT 가 없으면 리전의 S3 주소 s3.<TEMPO_S3_REGION>.amazonaws.com 이다)
#
# 자격 증명은 여기 없다. 비어 있으면 SDK 기본 체인을 쓴다 — ECS 에서는 태스크 역할이다.
#
# obs 태스크의 컨테이너는 localhost 를 같이 쓴다(awsvpc). 포트가 Collector(4317 · 4318) · Loki(3100 · 9096) 와 겹치지 않게 둔다.
#   3200   HTTP (조회 · Grafana)
#   9097   gRPC (내부)
#   14317  OTLP gRPC 수신 — OTel 게이트웨이(Service Connect tempo-otlp, NV-543)와 obs Collector 만 보낸다. obs 보안 그룹은 게이트웨이 SG 에만 연다.
#          앱은 직접 보내지 않는다(Collector 를 거친다). 기본값 4317 · 4318 은 Collector 와 겹쳐 쓰지 않는다
# memberlist(7946)는 쓰지 않는다(링은 메모리).
# 샘플링은 Collector(tail_sampling)가 끝낸 뒤라 Tempo 는 받은 것을 모두 저장한다.

stream_over_http_enabled: true

server:
  http_listen_port: 3200
  grpc_listen_port: 9097
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          # 모든 주소에 연다. localhost 가 ::1 로 먼저 풀려 127.0.0.1 만 열면 Collector 가 매번 한 번씩 실패하고 다시 붙는다.
          # 태스크 밖에서는 닿지 않는다 — obs 보안 그룹은 4317 · 4318 만 연다
          endpoint: :14317

# 한 대뿐이라 링을 메모리에 둔다(memberlist 를 쓰지 않는다)
ingester:
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
  # 트레이스가 끝났다고 보고 블록으로 자르기까지. 짧을수록 WAL 이 작고 S3 에 빨리 오른다
  trace_idle_period: 10s
  max_block_duration: 30m
  # 정상 종료(작업 정의의 stopTimeout 안)면 들고 있던 블록을 S3 로 올리고 내려간다. Loki 의 flush_on_shutdown 과 같다
  flush_all_on_shutdown: true

compactor:
  compaction:
    # 보존 기간. 지나면 compactor 가 S3 의 블록을 지운다. S3 수명주기의 만료는 안전망일 뿐이다(s3 스택)
    block_retention: ${TEMPO_RETENTION}

storage:
  trace:
    backend: s3
    s3:
      bucket: ${TEMPO_S3_BUCKET}
      region: ${TEMPO_S3_REGION}
      endpoint: ${TEMPO_S3_ENDPOINT:-s3.${TEMPO_S3_REGION}.amazonaws.com}
      forcepathstyle: ${TEMPO_S3_FORCE_PATH_STYLE:-false}
      insecure: ${TEMPO_S3_INSECURE:-false}
    # 재시작 뒤 아직 블록이 되지 않은 스팬을 되살리는 근거. /var/tempo 는 영속 디스크여야 한다.
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# TraceQL 지표 쿼리({ … } | rate() 등). Grafana Traces Drilldown 이 이것으로 속성별 처리량 · 오류 · 지연을 그린다.
# local-blocks 가 최근 스팬을 따로 블록으로 들고 최근 구간 질의에 답한다. 지난 구간은 S3 의 블록을 읽는다.
# 받은 스팬(샘플링 뒤)만 보므로 비율 · 처리량의 기준은 Collector 의 spanmetrics 다. 여기는 오류 · 느린 요청의 속성 비교에 쓴다.
metrics_generator:
  ring:
    kvstore:
      store: inmemory
  processor:
    local_blocks:
      filter_server_spans: false
      flush_to_storage: false
  traces_storage:
    path: /var/tempo/generator/traces
  storage:
    path: /var/tempo/generator/wal

overrides:
  defaults:
    metrics_generator:
      processors: [local-blocks]

# 사용 통계를 grafana.com 으로 보내지 않는다.
usage_report:
  reporting_enabled: false
