# API CloudFront 가 캐시하는 공개 조회 경로(CloudFront 경로 패턴). main.tf 가 경로마다 캐시 동작을 만든다.
#
# 넣는 조건: 토큰 없이 부르고, 누가 불러도 응답이 같은 GET. be catalog 가 이런 응답에만 Cache-Control: public, max-age 를
# 붙이고(PublicCache — 상품 · 홍보 · 배너 최대 5초, 리뷰 60초, 카테고리 5분) 관리자 · 오류 응답은 no-store 다.
# 캐시 시간은 그 값을 그대로 따른다(여기서 정하지 않는다). 그래서 be 가 public 을 붙이지 않는 응답은 이 경로여도 캐시되지 않는다.
# 같은 경로의 POST · PATCH · DELETE 는 캐시하지 않고 지금처럼 원본으로 간다.
#
# 패턴의 * 는 / 도 넘는다. 토큰이 필요한 GET 이 걸리지 않게 고른다(/api/v1/reviews 는 정확히 그 경로만 — /reviews/mine · writable 은 회원 전용).
#
# 무효화(배포 없이 바로 비울 때):
#   aws cloudfront create-invalidation --distribution-id <api 배포 ID> --paths $(yq '.[]' cache_paths.yml)
- /api/v1/products
- /api/v1/products/*
- /api/v1/categories
- /api/v1/reviews
- /api/v1/promotions
- /api/v1/promotions/*
- /api/v1/banners
